<html lang="th">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Sarabun',sans-serif;background:#0f0d1a;color:#fff;min-height:100vh;}
  #root{min-height:100vh;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const GROQ_KEY = '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';
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyBVdS7D6qMUKCacdljclXIksFgVHYKGkVRRG9xY8Te6yGA0bpAyIFJ8jZhFZTFaoD5/exec';

const SUBJECTS = ['คณิตศาสตร์','ฟิสิกส์','เคมี','ชีววิทยา','คอมพิวเตอร์','ภาษาอังกฤษ','ภาษาไทย','สังคมศึกษา','ประวัติศาสตร์','ศิลปะ','ดนตรี','พลศึกษา','เศรษฐศาสตร์','จิตวิทยา'];
const ACTIVITIES = ['เขียนโปรแกรม','เล่นเกม','วาดรูป/ออกแบบ','อ่านหนังสือ','เล่นกีฬา','ดูหนัง/ซีรีส์','เล่นดนตรี','ทำอาหาร','ถ่ายภาพ','เขียน/บล็อก','ทำธุรกิจ','ทำจิตอาสา','ทดลองสิ่งใหม่','ท่องเที่ยว'];

/* ── STYLES ── */
const S = {
  page: {minHeight:'100vh', background:'#0f0d1a'},
  grad: {position:'fixed',inset:0,background:'radial-gradient(ellipse at 15% 20%,rgba(76,29,149,.35) 0%,transparent 55%),radial-gradient(ellipse at 85% 80%,rgba(109,40,217,.18) 0%,transparent 55%)',pointerEvents:'none',zIndex:0},
  wrap: {position:'relative',zIndex:1,maxWidth:680,margin:'0 auto',padding:'0 20px 80px'},
  nav:  {position:'relative',zIndex:10,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 28px',borderBottom:'1px solid rgba(212,175,80,.15)',background:'rgba(15,13,26,.8)'},
  logo: {fontSize:18,fontWeight:800,color:'#d4af50',cursor:'pointer',textDecoration:'none'},
  tag:  {fontSize:11,letterSpacing:3,textTransform:'uppercase',color:'#d4af50',marginBottom:10},
  h1:   {fontSize:'clamp(28px,7vw,52px)',fontWeight:800,lineHeight:1.1,marginBottom:16},
  h2:   {fontSize:'clamp(20px,4vw,28px)',fontWeight:800,lineHeight:1.3,marginBottom:8,color:'#f1f5f9'},
  sub:  {color:'rgba(255,255,255,.4)',fontSize:14,lineHeight:1.6,marginBottom:24},
  card: {background:'rgba(76,29,149,.1)',border:'1px solid rgba(212,175,80,.12)',borderRadius:16,padding:'24px 20px',marginBottom:16,transition:'border-color .2s'},
  label:{display:'block',fontSize:13,fontWeight:600,color:'rgba(255,255,255,.7)',marginBottom:7},
  input:{width:'100%',padding:'11px 14px',background:'rgba(255,255,255,.05)',border:'1.5px solid rgba(212,175,80,.15)',borderRadius:10,color:'#f1f5f9',fontSize:14,fontFamily:'Sarabun,sans-serif',outline:'none'},
  sel:  {width:'100%',padding:'11px 14px',background:'rgba(30,27,46,1)',border:'1.5px solid rgba(212,175,80,.15)',borderRadius:10,color:'#f1f5f9',fontSize:14,fontFamily:'Sarabun,sans-serif',outline:'none'},
  ta:   {width:'100%',padding:'11px 14px',background:'rgba(255,255,255,.05)',border:'1.5px solid rgba(212,175,80,.15)',borderRadius:10,color:'#f1f5f9',fontSize:14,fontFamily:'Sarabun,sans-serif',outline:'none',resize:'vertical',minHeight:90,lineHeight:1.6},
  btnP: {display:'block',width:'100%',padding:'13px 24px',fontSize:15,fontWeight:700,fontFamily:'Sarabun,sans-serif',border:'none',borderRadius:12,background:'linear-gradient(135deg,#4c1d95,#6d28d9)',color:'#fff',cursor:'pointer'},
  btnS: {padding:'11px 22px',fontSize:14,fontWeight:600,fontFamily:'Sarabun,sans-serif',border:'1.5px solid rgba(212,175,80,.2)',borderRadius:10,background:'transparent',color:'rgba(212,175,80,.7)',cursor:'pointer'},
  chips:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:8,marginTop:6},
};

/* ── CHIP ── */
function Chip({label, selected, onToggle}) {
  return (
    <div onClick={onToggle} style={{
      display:'flex',alignItems:'center',gap:8,padding:'10px 12px',
      border:`1.5px solid ${selected ? '#d4af50' : 'rgba(212,175,80,.12)'}`,
      borderRadius:9,
      background: selected ? 'rgba(76,29,149,.3)' : 'rgba(255,255,255,.03)',
      cursor:'pointer',userSelect:'none',transition:'all .15s',
    }}>
      <div style={{
        width:16,height:16,borderRadius:4,flexShrink:0,
        border:`1.5px solid ${selected ? '#d4af50' : 'rgba(255,255,255,.25)'}`,
        background: selected ? '#6d28d9' : 'transparent',
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:11,color:'#fff',transition:'all .15s',
      }}>{selected ? '✓' : ''}</div>
      <span style={{fontSize:13,color:'#cbd5e1'}}>{label}</span>
    </div>
  );
}

/* ── PROGRESS ── */
function Progress({step}) {
  const pct = Math.round(step/4*100);
  return (
    <div style={{maxWidth:680,margin:'0 auto',padding:'20px 20px 0'}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'rgba(212,175,80,.5)',marginBottom:6}}>
        <span>ขั้นตอน {step} จาก 4</span><span>{pct}%</span>
      </div>
      <div style={{height:4,background:'rgba(255,255,255,.08)',borderRadius:4,overflow:'hidden'}}>
        <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,#4c1d95,#d4af50)',transition:'width .4s',borderRadius:4}} />
      </div>
    </div>
  );
}

/* ── LOADING ── */
function Loading() {
  return (
    <div style={{position:'fixed',inset:0,zIndex:999,background:'rgba(15,13,26,.97)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <div style={{width:48,height:48,border:'3px solid rgba(255,255,255,.08)',borderTopColor:'#d4af50',borderRadius:'50%',animation:'spin 1s linear infinite'}} />
      <div style={{fontSize:16,color:'#e2e8f0'}}>AI กำลังวิเคราะห์...</div>
      <div style={{fontSize:13,color:'rgba(255,255,255,.35)'}}>ใช้เวลาประมาณ 15-30 วินาที</div>
    </div>
  );
}

/* ── HOME ── */
function Home({onStart}) {
  return (
    <div style={S.page}>
      <div style={S.grad} />
      <nav style={S.nav}>
        <span style={S.logo}>KUS Compass</span>
        <span style={{padding:'6px 14px',borderRadius:999,border:'1px solid rgba(212,175,80,.3)',color:'#d4af50',fontSize:12}}>Senior Project 2026</span>
      </nav>
      <div style={{...S.wrap,textAlign:'center',paddingTop:80,paddingBottom:80}}>
        <div style={{display:'inline-flex',alignItems:'center',gap:8,padding:'8px 20px',borderRadius:999,border:'1px solid rgba(212,175,80,.35)',background:'rgba(212,175,80,.08)',color:'#d4af50',fontSize:13,marginBottom:28}}>
          🎓 โรงเรียนสาธิตแห่งมหาวิทยาลัยเกษตรศาสตร์
        </div>
        <h1 style={S.h1}>
          <span style={{background:'linear-gradient(135deg,#d4af50,#f0d060)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>KUS</span>
          <br/><span style={{color:'#f1f5f9'}}>Compass</span>
        </h1>
        <p style={{...S.sub,maxWidth:500,margin:'0 auto 40px',fontSize:17}}>
          ค้นพบ<strong style={{color:'rgba(255,255,255,.85)'}}>คณะและมหาวิทยาลัย</strong>ที่ใช่<br/>ด้วยการวิเคราะห์จาก AI ใน 2 นาที
        </p>
        <button style={{...S.btnP,width:'auto',display:'inline-block',padding:'16px 48px',fontSize:17}} onClick={onStart}>
          เริ่มค้นหาคณะของฉัน →
        </button>
        <div style={{display:'flex',justifyContent:'center',gap:40,marginTop:60,padding:'28px 20px',border:'1px solid rgba(212,175,80,.15)',borderRadius:20,background:'rgba(76,29,149,.08)'}}>
          {[['50+','คณะที่ครอบคลุม'],['30+','มหาวิทยาลัย'],['2 นาที','ได้ผลลัพธ์']].map(([n,l])=>(
            <div key={l} style={{textAlign:'center'}}>
              <div style={{fontSize:32,fontWeight:800,background:'linear-gradient(135deg,#d4af50,#f0d060)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{n}</div>
              <div style={{fontSize:11,color:'rgba(255,255,255,.3)',letterSpacing:2,textTransform:'uppercase',marginTop:4}}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{marginTop:48,padding:'28px 20px',borderTop:'1px solid rgba(212,175,80,.1)',borderBottom:'1px solid rgba(212,175,80,.1)',background:'rgba(76,29,149,.06)'}}>
          <p style={{fontSize:11,letterSpacing:3,color:'rgba(255,255,255,.25)',textTransform:'uppercase',marginBottom:10}}>คำขวัญประจำโรงเรียน</p>
          <p style={{fontSize:'clamp(14px,2.5vw,20px)',fontWeight:700,color:'rgba(255,255,255,.65)',letterSpacing:3}}>
            <span style={{color:'#d4af50'}}>รอบรู้</span> · <span style={{color:'#d4af50'}}>สู้ชีวิต</span> · <span style={{color:'#d4af50'}}>จิตมั่นคง</span> · <span style={{color:'#d4af50'}}>ดำรงคุณธรรม</span>
          </p>
        </div>
      </div>
    </div>
  );
}

/* ── STEP 1 ── */
function Step1({data, setData, onNext}) {
  const toggle = (v) => {
    const s = new Set(data.subjects);
    s.has(v) ? s.delete(v) : s.add(v);
    setData({...data, subjects: s});
  };
  return (
    <div>
      <p style={S.tag}>ขั้นที่ 1 — วิชาเรียน</p>
      <h2 style={S.h2}>วิชาอะไรที่ทำให้คุณอยากเข้าห้องเรียน?</h2>
      <p style={S.sub}>แตะเลือกได้หลายวิชา ยิ่งตรงความจริง ผลยิ่งแม่น</p>
      <div style={{marginBottom:18}}>
        <label style={S.label}>วิชาที่ชอบ</label>
        <div style={S.chips}>
          {SUBJECTS.map(s => <Chip key={s} label={s} selected={data.subjects.has(s)} onToggle={()=>toggle(s)} />)}
        </div>
      </div>
      <div style={{marginBottom:24}}>
        <label style={S.label}>วิชาอื่นๆ (ถ้ามี)</label>
        <input style={S.input} value={data.subjOther} onChange={e=>setData({...data,subjOther:e.target.value})} placeholder="เช่น ดาราศาสตร์..." />
      </div>
      <button style={S.btnP} onClick={()=>{
        if(data.subjects.size===0){alert('กรุณาเลือกวิชาที่ชอบอย่างน้อย 1 วิชา');return;}
        onNext();
      }}>ถัดไป →</button>
    </div>
  );
}

/* ── STEP 2 ── */
function Step2({data, setData, onNext, onBack}) {
  const toggle = (v) => {
    const s = new Set(data.activities);
    s.has(v) ? s.delete(v) : s.add(v);
    setData({...data, activities: s});
  };
  return (
    <div>
      <p style={S.tag}>ขั้นที่ 2 — กิจกรรม</p>
      <h2 style={S.h2}>ชอบทำอะไรในเวลาว่าง?</h2>
      <p style={S.sub}>เลือกทุกอย่างที่ตรงกับตัวเอง</p>
      <div style={{marginBottom:18}}>
        <label style={S.label}>กิจกรรมที่ทำ</label>
        <div style={S.chips}>
          {ACTIVITIES.map(a => <Chip key={a} label={a} selected={data.activities.has(a)} onToggle={()=>toggle(a)} />)}
        </div>
      </div>
      <div style={{marginBottom:24}}>
        <label style={S.label}>กิจกรรมอื่นๆ (ถ้ามี)</label>
        <input style={S.input} value={data.actOther} onChange={e=>setData({...data,actOther:e.target.value})} placeholder="เช่น ทำหนัง..." />
      </div>
      <div style={{display:'flex',gap:10}}>
        <button style={S.btnS} onClick={onBack}>← กลับ</button>
        <button style={{...S.btnP,flex:1}} onClick={onNext}>ถัดไป →</button>
      </div>
    </div>
  );
}

/* ── STEP 3 ── */
function Step3({data, setData, onNext, onBack}) {
  return (
    <div>
      <p style={S.tag}>ขั้นที่ 3 — ข้อมูลส่วนตัว</p>
      <h2 style={S.h2}>บอกเพิ่มเติมเกี่ยวกับตัวเอง</h2>
      <p style={S.sub}>ช่วยให้ AI วิเคราะห์แม่นยำขึ้น</p>
      <div style={{marginBottom:16}}>
        <label style={S.label}>ชื่อ-นามสกุล</label>
        <input style={S.input} value={data.name} onChange={e=>setData({...data,name:e.target.value})} placeholder="เช่น นายสมชาย ใจดี" />
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
        <div>
          <label style={S.label}>ห้องเรียน</label>
          <input style={S.input} value={data.room} onChange={e=>setData({...data,room:e.target.value})} placeholder="เช่น ม.6/2" />
        </div>
        <div>
          <label style={S.label}>เลขที่</label>
          <input style={S.input} value={data.num} onChange={e=>setData({...data,num:e.target.value})} placeholder="เช่น 15" />
        </div>
      </div>
      <div style={{marginBottom:16}}>
        <label style={S.label}>เกรดเฉลี่ย (GPA)</label>
        <div style={{textAlign:'center',fontSize:52,fontWeight:800,color:'#d4af50',marginBottom:8}}>{parseFloat(data.gpa).toFixed(2)}</div>
        <input type="range" min="1" max="4" step="0.05" value={data.gpa}
          onChange={e=>setData({...data,gpa:e.target.value})}
          style={{width:'100%',accentColor:'#d4af50',cursor:'pointer'}} />
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'rgba(255,255,255,.3)',marginTop:4}}>
          <span>1.00</span><span>2.00</span><span>3.00</span><span>4.00</span>
        </div>
      </div>
      <div style={{marginBottom:16}}>
        <label style={S.label}>ชั้นเรียน</label>
        <select style={S.sel} value={data.grade} onChange={e=>setData({...data,grade:e.target.value})}>
          <option value="">— เลือก —</option>
          {['ม.4','ม.5','ม.6','จบ ม.6 แล้ว'].map(g=><option key={g}>{g}</option>)}
        </select>
      </div>
      <div style={{marginBottom:16}}>
        <label style={S.label}>แผนการเรียน</label>
        <select style={S.sel} value={data.plan} onChange={e=>setData({...data,plan:e.target.value})}>
          <option value="">— เลือก —</option>
          {['วิทย์-คณิต','ศิลป์-คำนวณ','ศิลป์-ภาษา','ศิลป์-สังคม','อื่นๆ'].map(p=><option key={p}>{p}</option>)}
        </select>
      </div>
      <div style={{marginBottom:24}}>
        <label style={S.label}>ความฝัน / อยากทำอะไรในอนาคต</label>
        <textarea style={S.ta} value={data.dream} onChange={e=>setData({...data,dream:e.target.value})} placeholder="เช่น อยากสร้างแอปของตัวเอง..." />
      </div>
      <div style={{display:'flex',gap:10}}>
        <button style={S.btnS} onClick={onBack}>← กลับ</button>
        <button style={{...S.btnP,flex:1}} onClick={()=>{
          if(!data.grade){alert('กรุณาเลือกชั้นเรียน');return;}
          onNext();
        }}>ถัดไป →</button>
      </div>
    </div>
  );
}

/* ── STEP 4 ── */
function Step4({data, onBack, onSubmit, loading}) {
  const subj = [...data.subjects, data.subjOther].filter(Boolean);
  const act  = [...data.activities, data.actOther].filter(Boolean);
  const rows = [
    ['ชื่อ', data.name||'-'],
    ['ห้อง / เลขที่', `${data.room||'-'} เลขที่ ${data.num||'-'}`],
    ['วิชาที่ชอบ', subj.join(', ')||'-'],
    ['กิจกรรม', act.join(', ')||'-'],
    ['GPA', parseFloat(data.gpa).toFixed(2)],
    ['ชั้นเรียน', `${data.grade} (${data.plan})`],
    ['ความฝัน', data.dream||'-'],
  ];
  return (
    <div>
      <p style={S.tag}>ขั้นที่ 4 — ยืนยันข้อมูล</p>
      <h2 style={S.h2}>ตรวจสอบแล้ววิเคราะห์ได้เลย!</h2>
      <p style={S.sub}>ตรวจสอบข้อมูลด้านล่างก่อนส่ง</p>
      <div style={S.card}>
        {rows.map(([k,v])=>(
          <div key={k} style={{display:'flex',gap:10,marginBottom:8,alignItems:'flex-start'}}>
            <span style={{fontSize:11,color:'rgba(212,175,80,.5)',letterSpacing:1,textTransform:'uppercase',minWidth:80,paddingTop:2}}>{k}</span>
            <span style={{fontSize:13,color:'#e2e8f0',lineHeight:1.55,flex:1}}>{v}</span>
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:10,marginTop:16}}>
        <button style={S.btnS} onClick={onBack}>← กลับ</button>
        <button style={{...S.btnP,flex:1}} onClick={onSubmit} disabled={loading}>
          {loading ? 'กำลังวิเคราะห์...' : '🚀 วิเคราะห์เลย!'}
        </button>
      </div>
    </div>
  );
}

/* ── RESULT ── */
function Result({result, onRedo}) {
  const [open, setOpen] = useState(0);
  const facs = result.faculties || [];
  const road = result.roadmap   || [];
  const rankColor = ['#d97706','#6b7280','#92400e'];
  const rankBg    = ['linear-gradient(135deg,#d97706,#f59e0b)','linear-gradient(135deg,#6b7280,#9ca3af)','linear-gradient(135deg,#92400e,#b45309)'];
  return (
    <div>
      <div style={{textAlign:'center',paddingBottom:48}}>
        <p style={{...S.tag,textAlign:'center'}}>ผลการวิเคราะห์ AI</p>
        <h1 style={{fontSize:'clamp(22px,5vw,38px)',fontWeight:900,color:'#f1f5f9',lineHeight:1.2,marginBottom:18}}>
          คณะที่ใช่ของคุณคือ<br/>
          <span style={{background:'linear-gradient(135deg,#d4af50,#f0d060)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
            {facs[0]?.name || 'คณะที่เหมาะกับคุณ'}
          </span>
        </h1>
        <div style={{...S.card,textAlign:'left',maxWidth:600,margin:'0 auto',fontSize:15,color:'rgba(255,255,255,.65)',lineHeight:1.8}}>
          {result.summary}
        </div>
      </div>

      <div style={{marginBottom:48}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,paddingBottom:14,borderBottom:'1px solid rgba(212,175,80,.1)'}}>
          <div style={{width:36,height:36,borderRadius:10,background:'rgba(76,29,149,.5)',border:'1px solid rgba(212,175,80,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>🎓</div>
          <h2 style={{fontSize:20,fontWeight:800,color:'#f1f5f9',margin:0}}>คณะที่แนะนำ</h2>
        </div>
        {facs.map((f,i)=>(
          <div key={i} style={{...S.card,marginBottom:14,borderColor: i===0 ? 'rgba(212,175,80,.3)' : 'rgba(212,175,80,.12)'}}>
            <div style={{display:'flex',alignItems:'center',gap:14,cursor:'pointer'}} onClick={()=>setOpen(open===i?-1:i)}>
              <div style={{width:38,height:38,borderRadius:10,background:rankBg[i]||'rgba(76,29,149,.5)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,fontWeight:900,color: i<2?'#1c1917':'#fff',flexShrink:0}}>{f.rank||i+1}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:16,fontWeight:800,color:'#f1f5f9',marginBottom:3}}>{f.name}</div>
                <div style={{fontSize:12,color:'rgba(212,175,80,.5)'}}>{(f.careers||[]).join(' · ')}</div>
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                <div style={{fontSize:24,fontWeight:900,background:'linear-gradient(135deg,#d4af50,#f0d060)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{f.match}%</div>
                <div style={{fontSize:11,color:'rgba(212,175,80,.4)',letterSpacing:1}}>MATCH</div>
              </div>
            </div>
            {open===i && (
              <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid rgba(212,175,80,.1)'}}>
                <p style={{color:'rgba(255,255,255,.55)',fontSize:14,lineHeight:1.75,marginBottom:16}}>{f.reason}</p>
                <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:18}}>
                  {(f.careers||[]).map(c=>(
                    <span key={c} style={{padding:'4px 13px',fontSize:12,background:'rgba(76,29,149,.25)',border:'1px solid rgba(212,175,80,.2)',borderRadius:999,color:'#d4af50'}}>{c}</span>
                  ))}
                </div>
                <p style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:'rgba(212,175,80,.45)',marginBottom:10}}>มหาวิทยาลัยที่เปิดสอน</p>
                {(f.universities||[]).map((u,j)=>(
                  <div key={j} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'11px 13px',background:'rgba(76,29,149,.08)',border:'1px solid rgba(212,175,80,.08)',borderRadius:10,marginBottom:8}}>
                    <div style={{width:7,height:7,borderRadius:'50%',background:'linear-gradient(135deg,#4c1d95,#d4af50)',flexShrink:0,marginTop:5}} />
                    <div>
                      <div style={{fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{u.name}</div>
                      <div style={{fontSize:12,color:'rgba(255,255,255,.4)',marginTop:2}}>{u.program}</div>
                      {u.note && <div style={{fontSize:11,color:'rgba(212,175,80,.4)',marginTop:2}}>{u.note}</div>}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>

      <div style={{marginBottom:48}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,paddingBottom:14,borderBottom:'1px solid rgba(212,175,80,.1)'}}>
          <div style={{width:36,height:36,borderRadius:10,background:'rgba(76,29,149,.5)',border:'1px solid rgba(212,175,80,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>🗺️</div>
          <h2 style={{fontSize:20,fontWeight:800,color:'#f1f5f9',margin:0}}>Roadmap การเตรียมตัว</h2>
        </div>
        {road.map((p,i)=>(
          <div key={i} style={{display:'flex',gap:18,paddingBottom:20,borderBottom: i<road.length-1?'1px solid rgba(212,175,80,.08)':'none',marginBottom: i<road.length-1?20:0}}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',flexShrink:0,width:18}}>
              <div style={{width:18,height:18,borderRadius:'50%',background:'linear-gradient(135deg,#4c1d95,#d4af50)'}} />
              {i<road.length-1 && <div style={{flex:1,width:2,background:'rgba(212,175,80,.1)',marginTop:6}} />}
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:'#d4af50',marginBottom:4}}>{p.phase}</div>
              <div style={{fontSize:16,fontWeight:700,color:'#f1f5f9',marginBottom:10}}>{p.title}</div>
              {(p.items||[]).map((it,j)=>(
                <div key={j} style={{display:'flex',gap:8,fontSize:13,color:'rgba(255,255,255,.5)',lineHeight:1.5,marginBottom:5}}>
                  <span style={{color:'rgba(212,175,80,.4)',flexShrink:0}}>·</span>{it}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      {result.tip && (
        <div style={{...S.card,display:'flex',gap:14,marginBottom:48,borderColor:'rgba(212,175,80,.2)',background:'linear-gradient(135deg,rgba(76,29,149,.15),rgba(212,175,80,.06))'}}>
          <span style={{fontSize:26,flexShrink:0}}>🌟</span>
          <p style={{fontSize:14,color:'#d4af50',lineHeight:1.8,margin:0}}>{result.tip}</p>
        </div>
      )}

      <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
        <button style={{...S.btnP,width:'auto',padding:'14px 32px'}} onClick={()=>window.print()}>🖨️ พิมพ์ผลลัพธ์</button>
        <button style={{...S.btnS,padding:'14px 24px'}} onClick={onRedo}>ทำแบบประเมินใหม่</button>
      </div>
    </div>
  );
}

/* ── MAIN APP ── */
function App() {
  const [screen, setScreen] = useState('home'); // home | form | result
  const [step,   setStep]   = useState(1);
  const [loading, setLoading] = useState(false);
  const [result, setResult]  = useState(null);
  const [data, setData] = useState({
    subjects: new Set(), subjOther:'',
    activities: new Set(), actOther:'',
    name:'', room:'', num:'', gpa:'3',
    grade:'', plan:'', dream:'',
  });

  const resetData = () => {
    setData({subjects:new Set(),subjOther:'',activities:new Set(),actOther:'',name:'',room:'',num:'',gpa:'3',grade:'',plan:'',dream:''});
    setStep(1);
  };

  const submitForm = async () => {
    const subj = [...data.subjects, data.subjOther].filter(Boolean);
    const act  = [...data.activities, data.actOther].filter(Boolean);
    const gpa  = parseFloat(data.gpa).toFixed(2);
    const prompt = `คุณคือที่ปรึกษาการศึกษาไทย ตอบภาษาไทยเท่านั้น ห้ามใช้ตัวอักษรจีนหรือญี่ปุ่น
ข้อมูล: ชั้น ${data.grade} แผน${data.plan} GPA ${gpa} วิชา ${subj.join(',')} กิจกรรม ${act.join(',')} ความฝัน ${data.dream}
ตอบ JSON เท่านั้น ไม่มีข้อความอื่น:
{"summary":"สรุปบุคลิกภาพ","faculties":[{"rank":1,"name":"คณะวิศวกรรมศาสตร์","match":90,"reason":"เหตุผล","careers":["อาชีพ1","อาชีพ2","อาชีพ3"],"universities":[{"name":"จุฬาฯ","program":"สาขา","note":"หมายเหตุ"}]}],"roadmap":[{"phase":"ม.ปลาย","title":"สิ่งที่ทำ","items":["รายการ1","รายการ2"]}],"tip":"คำแนะนำ"}
กฎ: 3 คณะ แต่ละคณะ 3 มหาวิทยาลัยในไทย roadmap 3 ช่วง ใช้ชื่อคณะจริง`;

    setLoading(true);
    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
        body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],max_tokens:2000,temperature:0.4})
      });
      const json = await res.json();
      if(!res.ok) throw new Error(json.error?.message||'Error '+res.status);
      let txt = json.choices[0].message.content;
      txt = txt.replace(/```json/g,'').replace(/```/g,'').trim();
      const s=txt.indexOf('{'),e=txt.lastIndexOf('}');
      if(s>-1&&e>-1) txt=txt.substring(s,e+1);
      txt = txt.replace(/[\r\n\t]/g,' ').replace(/,\s*}/g,'}').replace(/,\s*]/g,']');
      const r = JSON.parse(txt);
      // save to sheets
      try {
        fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:data.name,classroom:data.room,studentNo:data.num,subjects:subj.join(', '),activities:act.join(', '),gpa,grade:data.grade,plan:data.plan,dream:data.dream,faculty1:r.faculties[0]?.name||'',faculty2:r.faculties[1]?.name||'',faculty3:r.faculties[2]?.name||''})
        });
      } catch(e){}
      setResult(r);
      setScreen('result');
    } catch(err) {
      alert('เกิดข้อผิดพลาด: '+err.message);
    } finally {
      setLoading(false);
    }
  };

  if(screen==='home') return <Home onStart={()=>setScreen('form')} />;

  if(screen==='result') return (
    <div style={S.page}>
      <div style={S.grad} />
      <nav style={S.nav}>
        <span style={S.logo} onClick={()=>{setScreen('home');resetData();}}>KUS Compass</span>
        <button style={S.btnS} onClick={()=>{setScreen('form');setStep(1);}}>ทำแบบประเมินใหม่</button>
      </nav>
      <div style={S.wrap}><Result result={result} onRedo={()=>{setScreen('form');resetData();}} /></div>
    </div>
  );

  return (
    <div style={S.page}>
      {loading && <Loading />}
      <div style={S.grad} />
      <nav style={S.nav}>
        <span style={S.logo} onClick={()=>setScreen('home')}>KUS Compass</span>
        <span style={{fontSize:14,color:'rgba(212,175,80,.5)'}}>กรอกข้อมูล</span>
      </nav>
      <Progress step={step} />
      <div style={S.wrap}>
        <div style={{paddingTop:24}}>
          {step===1 && <Step1 data={data} setData={setData} onNext={()=>setStep(2)} />}
          {step===2 && <Step2 data={data} setData={setData} onNext={()=>setStep(3)} onBack={()=>setStep(1)} />}
          {step===3 && <Step3 data={data} setData={setData} onNext={()=>setStep(4)} onBack={()=>setStep(2)} />}
          {step===4 && <Step4 data={data} onBack={()=>setStep(3)} onSubmit={submitForm} loading={loading} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
