const RIASEC_Q = [

  {id:'R2',type:'R',text:'ฉันชอบทำกิจกรรมกลางแจ้งและใช้ร่างกาย'},
  {id:'I1',type:'I',text:'ฉันชอบวิเคราะห์ข้อมูลและหาคำตอบจากหลักฐาน'},
  {id:'I2',type:'I',text:'ฉันชอบทดลองและตั้งสมมติฐานเพื่อพิสูจน์'},
  {id:'A1',type:'A',text:'ฉันชอบสร้างสรรค์งานศิลปะ ดนตรี หรือเขียนเรื่อง'},
  {id:'A2',type:'A',text:'ฉันชอบแสดงออกและคิดนอกกรอบ'},

  {id:'E1',type:'E',text:'ฉันชอบโน้มน้าวและนำทีมให้บรรลุเป้าหมาย'},
  {id:'E2',type:'E',text:'ฉันชอบวางแผนธุรกิจและการขาย'},
  {id:'C1',type:'C',text:'ฉันชอบจัดระเบียบข้อมูลและทำงานตามขั้นตอน'},
  {id:'C2',type:'C',text:'ฉันชอบความถูกต้อง แม่นยำ และทำตามกฎ'},

const ACTIVITIES = ['เขียนโปรแกรม','เล่นเกม','วาดรูป/ออกแบบ','อ่านหนังสือ','เล่นกีฬา','ดูหนัง/ซีรีส์','เล่นดนตรี','ทำอาหาร','ถ่ายภาพ','เขียน/บล็อก','ทำธุรกิจ','ทำจิตอาสา','ทดลองสิ่งใหม่','ท่องเที่ยว'];

/* ─── Compute RIASEC top types ─── */
function computeRiasec(scores){
  const totals={R:0,I:0,A:0,S:0,E:0,C:0};
  RIASEC_Q.forEach(q=>{ totals[q.type]+=(scores[q.id]||0); });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]).join('');
}

/* ─── Colours ─── */
const C={purple:'#4c1d95',mid:'#6d28d9',gold:'#d4af50',goldf:'rgba(212,175,80,',bg:'#0f0d1a'};

/* ─── Chip ─── */
function Chip({label,selected,onToggle}){
  return(
    <div onClick={onToggle} style={{
      display:'flex',alignItems:'center',gap:8,padding:'10px 13px',
      border:`1.5px solid ${selected?C.gold:'rgba(212,175,80,.13)'}`,

      transition:'all .15s',animation:selected?'pop .2s ease':'none',
    }}>
      <div style={{width:16,height:16,borderRadius:4,flexShrink:0,border:`1.5px solid ${selected?C.gold:'rgba(255,255,255,.2)'}`,background:selected?C.mid:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#fff'}}>
        {selected?'✓':''}
      </div>
      <span style={{fontSize:13,color:selected?'#f1f5f9':'#94a3b8'}}>{label}</span>
    </div>
  );
}

/* ─── RIASEC Slider ─── */
function RiasecSlider({q,value,onChange}){
  const labels=['ไม่เลย','น้อย','ปานกลาง','มาก','มากที่สุด'];
  return(
    <div style={{marginBottom:20,padding:'16px 18px',background:'rgba(76,29,149,.08)',border:'1px solid rgba(212,175,80,.1)',borderRadius:12}}>
      <p style={{fontSize:14,color:'#e2e8f0',marginBottom:12,lineHeight:1.55}}>{q.text}</p>
      <input type="range" min={0} max={4} step={1} value={value}
        onChange={e=>onChange(q.id,+e.target.value)}
        style={{width:'100%',accentColor:C.gold,cursor:'pointer',marginBottom:6}}/>
      <div style={{display:'flex',justifyContent:'space-between'}}>
        {labels.map((l,i)=>(
          <span key={i} style={{fontSize:10,color:value===i?C.gold:'rgba(255,255,255,.3)',fontWeight:value===i?700:400,transition:'color .15s'}}>{l}</span>
        ))}
      </div>
    </div>
  );
}

/* ─── Progress ─── */
function Progress({step,total=5}){
  const pct=Math.round(step/total*100);
  return(
    <div style={{maxWidth:680,margin:'0 auto',padding:'16px 20px 0'}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:`${C.goldf}.5)`,marginBottom:6}}>
        <span>ขั้นตอน {step} จาก {total}</span><span>{pct}%</span>
      </div>
      <div style={{height:3,background:'rgba(255,255,255,.07)',borderRadius:3,overflow:'hidden'}}>
        <div style={{height:'100%',width:pct+'%',background:`linear-gradient(90deg,${C.purple},${C.gold})`,transition:'width .5s ease',borderRadius:3}}/>
      </div>
      <div style={{display:'flex',gap:6,marginTop:8}}>
        {Array.from({length:total},(_,i)=>(
          <div key={i} style={{flex:1,height:3,borderRadius:3,background:i<step?C.gold:'rgba(255,255,255,.08)',transition:'background .3s'}}/>
        ))}
      </div>
    </div>
  );
}

  useEffect(()=>{const t=setInterval(()=>setMsg(m=>(m+1)%msgs.length),2000);return()=>clearInterval(t);},[]);
  return(
    <div style={{position:'fixed',inset:0,zIndex:999,background:'rgba(15,13,26,.97)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:20}}>
      <div style={{width:56,height:56,border:'3px solid rgba(212,175,80,.15)',borderTopColor:C.gold,borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
      <div style={{textAlign:'center'}}>
        <div style={{fontSize:16,color:'#e2e8f0',marginBottom:6,animation:'pulse 2s ease infinite'}}>{msgs[msg]}</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.3)'}}>วิเคราะห์ด้วย Holland RIASEC Theory</div>
      </div>
    </div>

}

          <div>
            <div style={{fontSize:14,fontWeight:700,color:'#f1f5f9'}}>KUS Compass</div>

/* ─── FORM WRAPPER ─── */
function FormPage({onDone,onHome}){
  const [step,setStep]=useState(1);
  const [loading,setLoading]=useState(false);
  const [data,setData]=useState({
    name:'',room:'',num:'',gpa:'3',grade:'',plan:'',dream:'',
    subjects:new Set(),subjOther:'',
    activities:new Set(),actOther:'',
    riasec:{},
  });
  const update=patch=>setData(d=>({...d,...patch}));
  const toggleSet=(key,v)=>setData(d=>{const s=new Set(d[key]);s.has(v)?s.delete(v):s.add(v);return{...d,[key]:s};});

  const wrap={position:'relative',zIndex:1,maxWidth:660,margin:'0 auto',padding:'20px 20px 80px'};
  const h2={fontSize:'clamp(20px,4vw,26px)',fontWeight:800,color:'#f1f5f9',lineHeight:1.3,marginBottom:7};
  const sub={color:'rgba(255,255,255,.4)',fontSize:14,lineHeight:1.6,marginBottom:22};
  const inp={width:'100%',padding:'11px 14px',background:'rgba(255,255,255,.05)',border:'1.5px solid rgba(212,175,80,.15)',borderRadius:10,color:'#f1f5f9',fontSize:14,fontFamily:'Sarabun,sans-serif',outline:'none',transition:'border-color .2s'};
  const sel={...inp,background:'rgba(30,27,46,1)'};
  const ta={...inp,resize:'vertical',minHeight:90,lineHeight:1.6};
  const btnP={width:'100%',padding:'13px',fontSize:15,fontWeight:700,fontFamily:'Sarabun,sans-serif',border:'none',borderRadius:12,background:`linear-gradient(135deg,${C.purple},${C.mid})`,color:'#fff',cursor:'pointer',transition:'opacity .2s'};
  const btnS={padding:'11px 20px',fontSize:14,fontWeight:600,fontFamily:'Sarabun,sans-serif',border:`1.5px solid ${C.goldf}.2)`,borderRadius:10,background:'transparent',color:`${C.goldf}.7)`,cursor:'pointer'};
  const row={display:'flex',gap:10,marginTop:20};
  const tag={fontSize:11,letterSpacing:3,textTransform:'uppercase',color:C.gold,marginBottom:10};
  const chips={display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(148px,1fr))',gap:8,marginBottom:18};
  const field={marginBottom:16};
  const lbl={display:'block',fontSize:13,fontWeight:600,color:'rgba(255,255,255,.7)',marginBottom:7};

  const submit=async()=>{
    const subj=[...data.subjects,data.subjOther].filter(Boolean);
    const act=[...data.activities,data.actOther].filter(Boolean);
    const gpa=parseFloat(data.gpa).toFixed(2);
    const riasecCode=computeRiasec(data.riasec);
    const riasecDesc=riasecCode.split('').map(c=>RIASEC_LABEL[c]).join(', ');

    const prompt=`คุณคือที่ปรึกษาการศึกษาไทยที่ใช้ Holland RIASEC Theory ในการแนะแนว
ตอบภาษาไทยเท่านั้น ห้ามใช้ตัวอักษรจีนหรือญี่ปุ่น

ข้อมูลนักเรียน:
- Holland RIASEC Code: ${riasecCode} (${riasecDesc})
- ชั้นเรียน: ${data.grade} แผน${data.plan} GPA ${gpa}
- วิชาที่ชอบ: ${subj.join(', ')}
- กิจกรรม: ${act.join(', ')}
- ความฝัน: ${data.dream}

อ้างอิง Holland RIASEC Theory ในการวิเคราะห์และแนะนำคณะที่เหมาะสมกับ RIASEC Code ของนักเรียน

ตอบ JSON เท่านั้น ไม่มีข้อความอื่น ไม่มี newline ใน string:
{"summary":"สรุปบุคลิกภาพตาม Holland RIASEC","riasecCode":"${riasecCode}","riasecDesc":"${riasecDesc}","faculties":[{"rank":1,"name":"คณะวิศวกรรมศาสตร์","match":90,"reason":"เหตุผลที่สอดคล้องกับ RIASEC","careers":["x","x","x"],"universities":[{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"}]},{"rank":2,"name":"x","match":80,"reason":"x","careers":["x","x","x"],"universities":[{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"}]},{"rank":3,"name":"x","match":70,"reason":"x","careers":["x","x","x"],"universities":[{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"}]}],"roadmap":[{"phase":"x","title":"x","items":["x","x","x"]},{"phase":"x","title":"x","items":["x","x","x"]},{"phase":"x","title":"x","items":["x","x","x"]}],"tip":"x"}`;

    setLoading(true);
    try{
      const call=async(msgs)=>{
        const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:msgs,max_tokens:2500,temperature:0.3})});
        const j=await r.json();
        if(!r.ok)throw new Error(j.error?.message||'Error '+r.status);
        return j.choices[0].message.content;
      };
      let txt=await call([{role:'user',content:prompt}]);
      const clean=t=>{t=t.replace(/```json/g,'').replace(/```/g,'').trim();const s=t.indexOf('{'),e=t.lastIndexOf('}');if(s>-1&&e>-1)t=t.substring(s,e+1);return t.replace(/[\r\n\t]/g,' ').replace(/[\x00-\x1F\x7F]/g,' ').replace(/,\s*}/g,'}').replace(/,\s*]/g,']');};
      txt=clean(txt);
      let result;
      try{result=JSON.parse(txt);}
      catch(e1){
        txt=await call([{role:'user',content:prompt},{role:'assistant',content:txt},{role:'user',content:'JSON มี syntax error กรุณาตอบ JSON ที่ถูกต้องใหม่ ห้ามมี newline ใน string ห้ามมีข้อความนอก JSON'}]);
        result=JSON.parse(clean(txt));
      }
      try{fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:data.name,classroom:data.room,studentNo:data.num,subjects:subj.join(', '),activities:act.join(', '),gpa,grade:data.grade,plan:data.plan,dream:data.dream,riasec:riasecCode,faculty1:result.faculties[0]?.name||'',faculty2:result.faculties[1]?.name||'',faculty3:result.faculties[2]?.name||''})});}catch(e){}
      onDone(result);
    }catch(err){alert('เกิดข้อผิดพลาด: '+err.message);}
    finally{setLoading(false);}
  };

  return(
    <div style={{background:C.bg,minHeight:'100vh'}}>
      {loading&&<Loading/>}
      <div style={{position:'fixed',inset:0,background:'radial-gradient(ellipse at 15% 20%,rgba(76,29,149,.3) 0%,transparent 55%)',pointerEvents:'none'}}/>
      <nav style={{position:'relative',zIndex:10,display:'flex',alignItems:'center',gap:10,padding:'14px 20px',borderBottom:`1px solid ${C.goldf}.15)`,background:'rgba(15,13,26,.8)'}}>
        <span style={{fontSize:16,fontWeight:800,color:C.gold,cursor:'pointer'}} onClick={onHome}>KUS Compass</span>
        <span style={{color:`${C.goldf}.3)`}}>/</span>
        <span style={{color:`${C.goldf}.5)`,fontSize:13}}>กรอกข้อมูล</span>
      </nav>
      <Progress step={step} total={5}/>
      <div style={wrap}>
        <div style={{paddingTop:20,animation:'fadeUp .35s ease'}}>

          {step===1&&(
            <div>
              <p style={tag}>ขั้นที่ 1 — ข้อมูลส่วนตัว</p>
              <h2 style={h2}>เริ่มต้นด้วยการรู้จักคุณ</h2>
              <p style={sub}>กรอกข้อมูลพื้นฐานเพื่อปรับผลลัพธ์ให้เหมาะกับคุณ</p>
              <div style={field}><label style={lbl}>ชื่อ-นามสกุล</label><input style={inp} value={data.name} onChange={e=>update({name:e.target.value})} placeholder="เช่น นายสมชาย ใจดี"/></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
                <div><label style={lbl}>ห้องเรียน</label><input style={inp} value={data.room} onChange={e=>update({room:e.target.value})} placeholder="เช่น ม.6/2"/></div>
                <div><label style={lbl}>เลขที่</label><input style={inp} value={data.num} onChange={e=>update({num:e.target.value})} placeholder="เช่น 15"/></div>
              </div>
              <div style={field}><label style={lbl}>ชั้นเรียน</label>
                <select style={sel} value={data.grade} onChange={e=>update({grade:e.target.value})}>
                  <option value="">— เลือก —</option>
                  {['ม.4','ม.5','ม.6','จบ ม.6 แล้ว'].map(g=><option key={g}>{g}</option>)}
                </select>
              </div>
              <div style={field}><label style={lbl}>แผนการเรียน</label>
                <select style={sel} value={data.plan} onChange={e=>update({plan:e.target.value})}>
                  <option value="">— เลือก —</option>
                  {['วิทย์-คณิต','ศิลป์-คำนวณ','ศิลป์-ภาษา','ศิลป์-สังคม','อื่นๆ'].map(p=><option key={p}>{p}</option>)}
                </select>
              </div>
              <div style={field}><label style={lbl}>เกรดเฉลี่ย (GPA)</label>
                <div style={{textAlign:'center',fontSize:48,fontWeight:800,color:C.gold,marginBottom:8}}>{parseFloat(data.gpa).toFixed(2)}</div>
                <input type="range" min={1} max={4} step={0.05} value={data.gpa} onChange={e=>update({gpa:e.target.value})} style={{width:'100%',accentColor:C.gold,cursor:'pointer'}}/>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'rgba(255,255,255,.3)',marginTop:4}}><span>1.00</span><span>2.00</span><span>3.00</span><span>4.00</span></div>
              </div>
              <button style={btnP} onClick={()=>{if(!data.grade){alert('กรุณาเลือกชั้นเรียน');return;}setStep(2);}}>ถัดไป →</button>
            </div>
          )}

          {step===2&&(
            <div>
              <p style={tag}>ขั้นที่ 2 — วิชาและกิจกรรม</p>
              <h2 style={h2}>คุณชอบอะไร?</h2>
              <p style={sub}>แตะเลือกวิชาและกิจกรรมที่ตรงกับตัวเอง</p>
              <div style={field}><label style={lbl}>วิชาที่ชอบ</label>
                <div style={chips}>{SUBJECTS.map(s=><Chip key={s} label={s} selected={data.subjects.has(s)} onToggle={()=>toggleSet('subjects',s)}/>)}</div>
                <input style={inp} value={data.subjOther} onChange={e=>update({subjOther:e.target.value})} placeholder="วิชาอื่นๆ (ถ้ามี)..."/>
              </div>
              <div style={field}><label style={lbl}>กิจกรรมที่ชอบ</label>
                <div style={chips}>{ACTIVITIES.map(a=><Chip key={a} label={a} selected={data.activities.has(a)} onToggle={()=>toggleSet('activities',a)}/>)}</div>
                <input style={{...inp,marginTop:8}} value={data.actOther} onChange={e=>update({actOther:e.target.value})} placeholder="กิจกรรมอื่นๆ (ถ้ามี)..."/>
              </div>
              <div style={row}><button style={btnS} onClick={()=>setStep(1)}>← กลับ</button><button style={{...btnP,flex:1}} onClick={()=>{if(data.subjects.size===0){alert('กรุณาเลือกวิชาที่ชอบอย่างน้อย 1 วิชา');return;}setStep(3);}}>ถัดไป →</button></div>
            </div>
          )}

          {step===3&&(
            <div>
              <p style={tag}>ขั้นที่ 3 — Holland RIASEC (ชุดที่ 1)</p>
              <h2 style={h2}>คุณเป็นคนแบบไหน?</h2>
              <p style={sub}>ทฤษฎี Holland แบ่งบุคลิกภาพ 6 ด้าน ซึ่งสัมพันธ์กับอาชีพและคณะที่เหมาะสม ตอบตามความจริงของตัวเอง</p>
              <div style={{padding:'12px 16px',borderRadius:10,background:'rgba(212,175,80,.08)',border:`1px solid ${C.goldf}.2)`,marginBottom:20}}>
                <p style={{fontSize:12,color:C.gold,fontWeight:600,marginBottom:4}}>🎯 Holland RIASEC Theory</p>
                <p style={{fontSize:12,color:'rgba(255,255,255,.5)',lineHeight:1.6}}>John Holland (1959) พบว่าบุคลิกภาพ 6 ประเภท ได้แก่ R-I-A-S-E-C สัมพันธ์กับสภาพแวดล้อมการทำงานและอาชีพ ใช้เป็นมาตรฐานในการแนะแนวอาชีพทั่วโลก</p>
              </div>
              {RIASEC_Q.slice(0,6).map(q=><RiasecSlider key={q.id} q={q} value={data.riasec[q.id]||0} onChange={(id,v)=>update({riasec:{...data.riasec,[id]:v}})}/>)}
              <div style={row}><button style={btnS} onClick={()=>setStep(2)}>← กลับ</button><button style={{...btnP,flex:1}} onClick={()=>setStep(4)}>ถัดไป →</button></div>
            </div>
          )}

          {step===4&&(
            <div>
              <p style={tag}>ขั้นที่ 4 — Holland RIASEC (ชุดที่ 2)</p>
              <h2 style={h2}>ต่ออีกนิดนะ!</h2>
              <p style={sub}>คำถามชุดสุดท้ายเพื่อให้ผลลัพธ์แม่นยำที่สุด</p>
              {RIASEC_Q.slice(6).map(q=><RiasecSlider key={q.id} q={q} value={data.riasec[q.id]||0} onChange={(id,v)=>update({riasec:{...data.riasec,[id]:v}})}/>)}
              <div style={field}><label style={lbl}>ความฝัน / อยากทำอะไรในอนาคต</label>
                <textarea style={ta} value={data.dream} onChange={e=>update({dream:e.target.value})} placeholder="เช่น อยากสร้างแอป อยากเป็นหมอ อยากออกแบบ..."/>
              </div>
              <div style={row}><button style={btnS} onClick={()=>setStep(3)}>← กลับ</button><button style={{...btnP,flex:1}} onClick={()=>setStep(5)}>ถัดไป →</button></div>
            </div>
          )}

          {step===5&&(
            <div>
              <p style={tag}>ขั้นที่ 5 — ยืนยันข้อมูล</p>
              <h2 style={h2}>พร้อมวิเคราะห์แล้ว!</h2>
              <p style={sub}>ตรวจสอบข้อมูลก่อนส่งให้ AI วิเคราะห์</p>
              {(()=>{
                const subj=[...data.subjects,data.subjOther].filter(Boolean);
                const act=[...data.activities,data.actOther].filter(Boolean);
                const rc=computeRiasec(data.riasec);
                const rows=[['ชื่อ',data.name||'-'],['ห้อง/เลขที่',`${data.room||'-'} เลขที่ ${data.num||'-'}`],['GPA',parseFloat(data.gpa).toFixed(2)],['ชั้นเรียน',`${data.grade} (${data.plan})`],['วิชาที่ชอบ',subj.join(', ')||'-'],['กิจกรรม',act.join(', ')||'-'],['Holland Code',rc||'-'],['ความฝัน',data.dream||'-']];
                return(
                  <div>
                    <div style={{background:'rgba(76,29,149,.12)',border:`1px solid ${C.goldf}.15)`,borderRadius:14,padding:'18px 20px',marginBottom:16}}>
                      {rows.map(([k,v])=>(
                        <div key={k} style={{display:'flex',gap:10,marginBottom:8,alignItems:'flex-start'}}>
                          <span style={{fontSize:11,color:`${C.goldf}.5)`,letterSpacing:1,textTransform:'uppercase',minWidth:90,paddingTop:2}}>{k}</span>
                          <span style={{fontSize:13,color:'#e2e8f0',lineHeight:1.55,flex:1}}>{v}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{padding:'14px 16px',borderRadius:10,background:'rgba(212,175,80,.06)',border:`1px solid ${C.goldf}.15)`,marginBottom:20}}>
                      <p style={{fontSize:12,color:C.gold,margin:0}}>🧠 AI จะวิเคราะห์โดยอ้างอิง <strong>Holland RIASEC Theory</strong> และแนะนำคณะที่เหมาะสมกับบุคลิกภาพของคุณ</p>
                    </div>
                  </div>
                );
              })()}
              <div style={row}><button style={btnS} onClick={()=>setStep(4)}>← กลับ</button><button style={{...btnP,flex:1}} onClick={submit}>🚀 วิเคราะห์เลย!</button></div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─── RESULT ─── */
function ResultPage({result,onRedo,onHome}){
  const [open,setOpen]=useState(0);
  const facs=result.faculties||[];
  const road=result.roadmap||[];
  const rankBg=['linear-gradient(135deg,#d97706,#f59e0b)','linear-gradient(135deg,#6b7280,#9ca3af)','linear-gradient(135deg,#92400e,#b45309)'];
  const rankTxt=['#1c1917','#fff','#fff'];
  const wrap={position:'relative',zIndex:1,maxWidth:820,margin:'0 auto',padding:'28px 20px 80px'};

  return(
    <div style={{background:C.bg,minHeight:'100vh'}}>
      <div style={{position:'fixed',inset:0,background:'radial-gradient(ellipse at 10% 20%,rgba(76,29,149,.35) 0%,transparent 55%),radial-gradient(ellipse at 90% 80%,rgba(109,40,217,.15) 0%,transparent 55%)',pointerEvents:'none'}}/>
      <nav style={{position:'relative',zIndex:10,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px',borderBottom:`1px solid ${C.goldf}.15)`,background:'rgba(15,13,26,.8)'}}>
        <span style={{fontSize:16,fontWeight:800,color:C.gold,cursor:'pointer'}} onClick={onHome}>KUS Compass</span>
        <button onClick={onRedo} style={{padding:'8px 16px',fontSize:13,fontWeight:600,fontFamily:'Sarabun,sans-serif',border:`1.5px solid ${C.goldf}.2)`,borderRadius:8,background:'transparent',color:`${C.goldf}.7)`,cursor:'pointer'}}>ทำแบบประเมินใหม่</button>
      </nav>

      <div style={wrap}>
        {/* HERO */}
        <div style={{textAlign:'center',paddingBottom:48,animation:'fadeUp .5s ease'}}>
          <p style={{fontSize:11,letterSpacing:3,textTransform:'uppercase',color:C.gold,marginBottom:14}}>ผลการวิเคราะห์ Holland RIASEC + AI</p>
          {result.riasecCode&&(
            <div style={{display:'inline-flex',alignItems:'center',gap:10,padding:'10px 20px',borderRadius:12,background:'rgba(76,29,149,.2)',border:`1px solid ${C.goldf}.25)`,marginBottom:20}}>
              <span style={{fontSize:22,fontWeight:900,color:C.gold,letterSpacing:4}}>{result.riasecCode}</span>
              <div style={{textAlign:'left'}}>
                <div style={{fontSize:11,color:`${C.goldf}.5)`,letterSpacing:1,textTransform:'uppercase'}}>Holland Code</div>
                <div style={{fontSize:12,color:'rgba(255,255,255,.6)'}}>{result.riasecDesc}</div>
              </div>
            </div>
          )}
          <h1 style={{fontSize:'clamp(22px,5vw,40px)',fontWeight:900,color:'#f1f5f9',lineHeight:1.2,marginBottom:18}}>
            คณะที่ใช่ของคุณคือ<br/>
            <span style={{background:`linear-gradient(135deg,${C.gold},#f0d060)`,WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
              {facs[0]?.name||'คณะที่เหมาะกับคุณ'}
            </span>
          </h1>
          <div style={{maxWidth:640,margin:'0 auto',padding:'18px 22px',background:'rgba(76,29,149,.12)',border:`1px solid ${C.goldf}.2)`,borderRadius:14,fontSize:15,color:'rgba(255,255,255,.65)',lineHeight:1.8,textAlign:'left'}}>
            {result.summary}
          </div>
        </div>

        {/* FACULTIES */}
        <div style={{marginBottom:48}}>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,paddingBottom:14,borderBottom:`1px solid ${C.goldf}.1)`}}>
            <div style={{width:36,height:36,borderRadius:10,background:'rgba(76,29,149,.5)',border:`1px solid ${C.goldf}.2)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>🎓</div>
            <h2 style={{fontSize:20,fontWeight:800,color:'#f1f5f9',margin:0}}>คณะที่แนะนำตาม Holland Code</h2>
          </div>
          {facs.map((f,i)=>(
            <div key={i} style={{background:'rgba(76,29,149,.1)',border:`1.5px solid ${i===0?C.goldf+',.35)':'rgba(212,175,80,.12)'}`,borderRadius:16,overflow:'hidden',marginBottom:14,transition:'border-color .2s'}}>
              <div style={{display:'flex',alignItems:'center',gap:14,padding:'18px 20px',cursor:'pointer'}} onClick={()=>setOpen(open===i?-1:i)}>
                <div style={{width:38,height:38,borderRadius:10,background:rankBg[i]||'rgba(76,29,149,.5)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,fontWeight:900,color:rankTxt[i]||'#fff',flexShrink:0}}>{i+1}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:16,fontWeight:800,color:'#f1f5f9',marginBottom:3}}>{f.name}</div>
                  <div style={{fontSize:12,color:`${C.goldf}.5)`}}>{(f.careers||[]).join(' · ')}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:24,fontWeight:900,background:`linear-gradient(135deg,${C.gold},#f0d060)`,WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{f.match}%</div>
                    <div style={{fontSize:10,color:`${C.goldf}.4)`,letterSpacing:1}}>MATCH</div>
                  </div>
                  <span style={{fontSize:18,color:`${C.goldf}.4)`,transform:open===i?'rotate(180deg)':'rotate(0)',transition:'transform .2s'}}>▾</span>
                </div>
              </div>
              {open===i&&(
                <div style={{padding:'0 20px 20px',borderTop:`1px solid ${C.goldf}.08)`}}>
                  <p style={{color:'rgba(255,255,255,.55)',fontSize:14,lineHeight:1.75,padding:'14px 0 16px'}}>{f.reason}</p>
                  <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:18}}>
                    {(f.careers||[]).map(c=><span key={c} style={{padding:'4px 13px',fontSize:12,background:'rgba(76,29,149,.25)',border:`1px solid ${C.goldf}.2)`,borderRadius:999,color:C.gold}}>{c}</span>)}
                  </div>
                  <p style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:`${C.goldf}.45)`,marginBottom:12}}>มหาวิทยาลัยที่เปิดสอน</p>
                  {(f.universities||[]).map((u,j)=>(
                    <div key={j} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'11px 13px',background:'rgba(76,29,149,.08)',border:`1px solid ${C.goldf}.08)`,borderRadius:10,marginBottom:8}}>
                      <div style={{width:7,height:7,borderRadius:'50%',background:`linear-gradient(135deg,${C.purple},${C.gold})`,flexShrink:0,marginTop:5}}/>
                      <div>
                        <div style={{fontSize:13,fontWeight:700,color:'#e2e8f0'}}>{u.name}</div>
                        <div style={{fontSize:12,color:'rgba(255,255,255,.4)',marginTop:2}}>{u.program}</div>
                        {u.note&&<div style={{fontSize:11,color:`${C.goldf}.4)`,marginTop:2}}>{u.note}</div>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>

        {/* ROADMAP */}
        <div style={{marginBottom:48}}>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,paddingBottom:14,borderBottom:`1px solid ${C.goldf}.1)`}}>
            <div style={{width:36,height:36,borderRadius:10,background:'rgba(76,29,149,.5)',border:`1px solid ${C.goldf}.2)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>🗺️</div>
            <h2 style={{fontSize:20,fontWeight:800,color:'#f1f5f9',margin:0}}>Roadmap การเตรียมตัว</h2>
          </div>
          {road.map((p,i)=>(
            <div key={i} style={{display:'flex',gap:18,paddingBottom:i<road.length-1?22:0,borderBottom:i<road.length-1?`1px solid ${C.goldf}.08)`:'none',marginBottom:i<road.length-1?22:0}}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',flexShrink:0,width:18}}>
                <div style={{width:18,height:18,borderRadius:'50%',background:`linear-gradient(135deg,${C.purple},${C.gold})`}}/>
                {i<road.length-1&&<div style={{flex:1,width:2,background:`${C.goldf}.1)`,marginTop:6}}/>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:C.gold,marginBottom:4}}>{p.phase}</div>
                <div style={{fontSize:16,fontWeight:700,color:'#f1f5f9',marginBottom:10}}>{p.title}</div>
                {(p.items||[]).map((it,j)=>(
                  <div key={j} style={{display:'flex',gap:8,fontSize:13,color:'rgba(255,255,255,.5)',lineHeight:1.5,marginBottom:5}}>
                    <span style={{color:`${C.goldf}.4)`,flexShrink:0}}>·</span>{it}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>

        {result.tip&&(
          <div style={{display:'flex',gap:14,padding:'20px 22px',background:'rgba(76,29,149,.12)',border:`1px solid ${C.goldf}.2)`,borderRadius:14,marginBottom:48}}>
            <span style={{fontSize:24,flexShrink:0}}>🌟</span>
            <p style={{fontSize:14,color:C.gold,lineHeight:1.8,margin:0}}>{result.tip}</p>
          </div>
        )}

        <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
          <button style={{padding:'13px 32px',fontSize:15,fontWeight:700,fontFamily:'Sarabun,sans-serif',border:'none',borderRadius:12,background:`linear-gradient(135deg,${C.purple},${C.mid})`,color:'#fff',cursor:'pointer'}} onClick={()=>window.print()}>🖨️ พิมพ์ผลลัพธ์</button>
          <button style={{padding:'13px 24px',fontSize:15,fontWeight:600,fontFamily:'Sarabun,sans-serif',border:`1.5px solid ${C.goldf}.2)`,borderRadius:12,background:'transparent',color:`${C.goldf}.7)`,cursor:'pointer'}} onClick={onRedo}>ทำแบบประเมินใหม่</button>
        </div>
      </div>
    </div>
  );
}

/* ─── APP ─── */
function App(){
  const [screen,setScreen]=useState('home');
  const [result,setResult]=useState(null);
  return(
    <>
      {screen==='home'&&<Home onStart={()=>setScreen('form')}/>}
      {screen==='form'&&<FormPage onDone={r=>{setResult(r);setScreen('result');}} onHome={()=>setScreen('home')}/>}
      {screen==='result'&&<ResultPage result={result} onRedo={()=>setScreen('form')} onHome={()=>setScreen('home')}/>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
