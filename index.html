<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUS Compass</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080612;
  --s1:#0d0a1c;--s2:#120f24;--s3:#18142e;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.10);--b3:rgba(255,255,255,.16);
  --t1:#f8fafc;--t2:#cbd5e1;--t3:#64748b;--t4:#334155;
  --p:#5b21b6;--pm:#7c3aed;--pl:#a78bfa;
  --g:#d4af50;--g2:#f0d060;
  --r1:6px;--r2:12px;--r3:18px;--r4:24px;
}
html{scroll-behavior:smooth;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
#root{min-height:100vh;}

/* ── Keyframes ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes sr{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes gm{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes ob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(28px,-22px) scale(1.04)}66%{transform:translate(-18px,16px) scale(.97)}}
@keyframes pop{0%{transform:scale(0) rotate(-10deg)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 4px 24px rgba(92,33,183,.45)}50%{box-shadow:0 6px 36px rgba(92,33,183,.65),0 0 48px rgba(212,175,80,.1)}}
@keyframes ls-in{from{opacity:0;transform:translateX(-8px)}to{opacity:.4;transform:translateX(0)}}
@keyframes ls-done{to{opacity:1}}
@keyframes bar{from{width:0}}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(124,58,237,.4);border-radius:2px}

/* ── Orbs ── */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.orb{position:absolute;border-radius:50%;}
.o1{width:60vw;height:60vw;top:-22%;left:-18%;background:radial-gradient(circle,rgba(76,29,149,.55) 0%,transparent 68%);animation:ob 16s ease-in-out infinite;}
.o2{width:48vw;height:48vw;bottom:-18%;right:-14%;background:radial-gradient(circle,rgba(109,40,217,.38) 0%,transparent 65%);animation:ob 20s ease-in-out infinite reverse;}
.o3{width:26vw;height:26vw;top:42%;right:12%;background:radial-gradient(circle,rgba(212,175,80,.07) 0%,transparent 70%);animation:ob 11s ease-in-out infinite;}
.grid-o{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.55) 0%,transparent 70%);}

/* ── Nav ── */
.nav{position:fixed;inset-inline:0;top:0;z-index:200;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(8,6,18,.85);border-bottom:0.5px solid var(--b1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.nav-brand{display:flex;align-items:center;gap:9px;cursor:pointer;text-decoration:none;}
.nav-mark{width:24px;height:24px;border-radius:6px;background:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-word{font-size:14px;font-weight:600;color:var(--t1);letter-spacing:-.2px;}
.nav-steps{display:flex;align-items:center;gap:6px;}
.nav-step{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px;}
.nav-step.on{color:var(--t2);}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--b3);}
.nav-step.on .nav-dot{background:var(--g);}
.nav-sep{color:var(--b3);font-size:10px;}
.nav-r{display:flex;gap:8px;align-items:center;}
.nav-pill{font-size:10px;padding:3px 10px;border-radius:999px;border:0.5px solid rgba(212,175,80,.22);color:rgba(212,175,80,.65);letter-spacing:.5px;}
.nb{font-size:12px;padding:5px 12px;border-radius:7px;border:0.5px solid var(--b2);background:transparent;color:var(--t3);cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .15s;}
.nb:hover{border-color:var(--b3);color:var(--t2);}
.nb.gold{border-color:rgba(212,175,80,.22);color:rgba(212,175,80,.75);}
.nb.gold:hover{border-color:rgba(212,175,80,.5);color:var(--g);}
.nav-pbar{position:absolute;bottom:-1px;left:0;right:0;height:1.5px;background:var(--b1);}
.nav-pfill{height:100%;background:linear-gradient(90deg,var(--p),var(--g));transition:width .6s cubic-bezier(.4,0,.2,1);}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:'Sarabun',sans-serif;font-weight:600;border:none;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);outline:none;text-decoration:none;}
.btn-p{font-size:15px;padding:12px 28px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--pm));color:#fff;box-shadow:0 4px 20px rgba(92,33,183,.4);animation:glow 3s ease infinite;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(92,33,183,.55);}
.btn-p:active{transform:translateY(0);box-shadow:0 2px 12px rgba(92,33,183,.4);}
.btn-o{font-size:14px;padding:10px 20px;border-radius:11px;background:transparent;color:var(--t3);border:0.5px solid var(--b2);}
.btn-o:hover{border-color:var(--b3);color:var(--t2);}

/* ── Inputs ── */
.inp,.sel,.ta{width:100%;padding:11px 14px;background:rgba(255,255,255,.04);border:0.5px solid var(--b2);border-radius:10px;color:var(--t1);font-size:14px;font-family:'Sarabun',sans-serif;outline:none;transition:all .18s;-webkit-appearance:none;}
.inp::placeholder,.ta::placeholder{color:var(--t4);}
.inp:focus,.sel:focus,.ta:focus{border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.06);box-shadow:0 0 0 3px rgba(124,58,237,.09);}
.sel{background:rgba(9,6,20,1);}
.sel option{background:#0c0919;}
.ta{resize:none;min-height:88px;line-height:1.65;}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,.1);border:none;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--pm),var(--g));border:1.5px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(124,58,237,.45);cursor:pointer;}

/* ── Chip ── */
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border:0.5px solid var(--b1);border-radius:9px;background:rgba(255,255,255,.02);cursor:pointer;user-select:none;transition:all .16s;}
.chip:hover{border-color:rgba(124,58,237,.4);background:rgba(124,58,237,.08);transform:translateY(-1px);}
.chip.on{border-color:rgba(212,175,80,.5);background:rgba(76,29,149,.25);box-shadow:0 2px 10px rgba(212,175,80,.08);}
.chip-chk{width:14px;height:14px;border-radius:3px;border:0.5px solid var(--b3);display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .16s;flex-shrink:0;}
.chip.on .chip-chk{background:var(--pm);border-color:rgba(212,175,80,.6);color:#fff;}
.chip-lbl{font-size:13px;color:var(--t3);transition:color .16s;}
.chip.on .chip-lbl{color:var(--t1);}

/* ── Progress ── */
.prog{max-width:660px;margin:0 auto;padding:10px 24px 0;}
.prog-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px;}
.prog-bar{height:1.5px;background:var(--b1);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pm),var(--g));transition:width .65s cubic-bezier(.4,0,.2,1);}
.prog-dots{display:flex;gap:4px;margin-top:7px;}
.prog-dot{flex:1;height:2px;border-radius:2px;transition:all .35s;}

/* ── Question Card ── */
.qc{border-radius:14px;border:0.5px solid var(--b1);background:rgba(255,255,255,.02);padding:18px 20px;margin-bottom:10px;transition:border-color .2s;}
.qc.a{border-color:rgba(124,58,237,.3);}
.qc-q{font-size:15px;color:var(--t1);margin-bottom:14px;line-height:1.6;font-weight:400;}
.qc-scale{display:flex;gap:2px;}
.qc-opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px 4px;border-radius:9px;transition:background .15s;}
.qc-opt:hover{background:rgba(255,255,255,.04);}
.qc-btn{width:34px;height:34px;border-radius:50%;border:0.5px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .18s;}
.qc-btn.s{border-color:rgba(212,175,80,.5);background:linear-gradient(135deg,rgba(92,33,183,.5),rgba(76,29,149,.4));box-shadow:0 0 12px rgba(212,175,80,.15);animation:pop .2s ease;}
.qc-lbl{font-size:10px;color:var(--t4);text-align:center;line-height:1.3;}

/* ── Glass Card ── */
.gc{background:rgba(255,255,255,.025);border:0.5px solid var(--b1);border-radius:var(--r3);}
.gc-gold{background:rgba(212,175,80,.04);border:0.5px solid rgba(212,175,80,.16);border-radius:14px;}

/* ── Summary row ── */
.sr-row{display:flex;gap:12px;margin-bottom:8px;align-items:flex-start;}
.sr-k{font-size:11px;color:rgba(212,175,80,.4);letter-spacing:.8px;text-transform:uppercase;min-width:80px;padding-top:2px;flex-shrink:0;}
.sr-v{font-size:13px;color:var(--t2);line-height:1.55;flex:1;}

/* ── Faculty Card ── */
.fc{border-radius:var(--r3);overflow:hidden;border:0.5px solid var(--b1);background:rgba(255,255,255,.02);transition:all .22s cubic-bezier(.4,0,.2,1);}
.fc:hover{border-color:rgba(212,175,80,.2);transform:translateY(-2px);box-shadow:0 14px 40px rgba(76,29,149,.18);}
.fc.top{border-color:rgba(212,175,80,.25);box-shadow:0 4px 20px rgba(212,175,80,.06);}
.fc-head{display:flex;align-items:center;gap:12px;padding:18px 20px;cursor:pointer;}
.fc-rank{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
.match-bar{height:3px;background:var(--b1);border-radius:2px;overflow:hidden;flex:1;}
.match-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--pm),var(--g));transition:width 1.4s cubic-bezier(.4,0,.2,1);}
.match-num{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--g),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:'Sarabun',sans-serif;}
.fc-body{padding:0 20px 20px;border-top:0.5px solid var(--b1);}
.ctag{display:inline-flex;align-items:center;font-size:11px;padding:4px 11px;background:rgba(124,58,237,.15);border:0.5px solid rgba(124,58,237,.25);border-radius:999px;color:rgba(212,175,80,.8);}

/* ── Uni card ── */
.uc{padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.02);border:0.5px solid var(--b1);transition:all .18s;}
.uc:hover{border-color:rgba(212,175,80,.15);transform:translateY(-1px);}

/* ── Timeline ── */
.tl-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--pm),var(--g));flex-shrink:0;box-shadow:0 0 8px rgba(212,175,80,.3);}
.tl-line{width:1.5px;flex:1;background:linear-gradient(to bottom,rgba(124,58,237,.35),rgba(212,175,80,.06));margin:3px 4.25px;}

/* ── RIASEC bar ── */
.rb{height:6px;background:var(--b1);border-radius:3px;overflow:hidden;flex:1;}
.rb-f{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}

/* ── Loading ── */
.ls{display:flex;align-items:center;gap:10px;padding:8px 0;opacity:.3;transition:opacity .4s;}
.ls.d{opacity:1;}
.ls-ico{width:20px;height:20px;border-radius:50%;border:0.5px solid var(--b3);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .3s;}
.ls.d .ls-ico{background:linear-gradient(135deg,var(--pm),var(--g));border-color:transparent;animation:pop .3s ease;}

/* ── Section header ── */
.sh{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:12px;border-bottom:0.5px solid var(--b1);}
.sh-ico{width:30px;height:30px;border-radius:8px;background:rgba(124,58,237,.2);border:0.5px solid rgba(124,58,237,.3);display:flex;align-items:center;justify-content:center;font-size:13px;}
.sh-t{font-size:16px;font-weight:700;color:var(--t1);margin:0;}

/* ── Eyebrow ── */
.eye{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:9px;display:block;opacity:.85;}

/* ── Label ── */
.lbl{display:block;font-size:12px;font-weight:500;color:var(--t3);margin-bottom:7px;letter-spacing:.2px;}

/* ── Footer ── */
.footer{position:relative;z-index:1;border-top:0.5px solid var(--b1);padding:24px 28px;display:flex;align-items:center;justify-content:space-between;}
.footer-l{font-size:11px;color:var(--t4);}
.footer-r{display:flex;gap:16px;}
.footer-r a{font-size:11px;color:var(--t4);text-decoration:none;transition:color .15s;}
.footer-r a:hover{color:var(--t3);}

@media(max-width:640px){
  .nav{padding:0 16px;}
  .hide-sm{display:none!important;}
  .two{grid-template-columns:1fr!important;}
  .hero-h{font-size:clamp(58px,16vw,82px)!important;}
  .qc-lbl{display:none;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
const GK = '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';
const SH = 'https://script.google.com/macros/s/AKfycbyBVdS7D6qMUKCacdljclXIksFgVHYKGkVRRG9xY8Te6yGA0bpAyIFJ8jZhFZTFaoD5/exec';

/* ── Data (unchanged) ── */
const RQ=[
  {id:'R1',t:'R',q:'เวลาว่าง เราชอบทำอะไรด้วยมือตัวเองบ้างไหม เช่น ซ่อมของ ประกอบชิ้นส่วน หรือทำงานช่าง?'},
  {id:'R2',t:'R',q:'รู้สึกสนุกและถนัดเวลาได้จับอุปกรณ์หรือเครื่องมือจริงๆ มากกว่านั่งอ่านหนังสือไหม?'},
  {id:'R3',t:'R',q:'ถ้าได้เลือกงาน เราอยากทำงานที่ได้ลงมือทำจริงในสนามมากกว่านั่งทำงานในออฟฟิศไหม?'},
  {id:'I1',t:'I',q:'เวลาเจอปัญหาหรือคำถามที่ไม่รู้คำตอบ เราชอบค้นหาและหาเหตุผลเองจนได้คำตอบไหม?'},
  {id:'I2',t:'I',q:'ชอบวิเคราะห์ข้อมูล ทดสอบสมมติฐาน หรือแก้โจทย์ที่ต้องคิดหนักๆ ไหม?'},
  {id:'I3',t:'I',q:'เคยอยากเป็นหมอ นักวิทยาศาสตร์ นักวิจัย หรือโปรแกรมเมอร์บ้างไหม?'},
  {id:'A1',t:'A',q:'เราชอบสร้างสรรค์สิ่งต่างๆ เช่น วาดรูป ถ่ายภาพ แต่งเพลง เขียนนิยาย หรือออกแบบบ้างไหม?'},
  {id:'A2',t:'A',q:'คนรอบข้างมักบอกว่าเรามีความคิดสร้างสรรค์หรือจินตนาการดีไหม?'},
  {id:'A3',t:'A',q:'อยากทำงานด้านศิลปะ ดีไซน์ สื่อ หรืองานที่ได้แสดงออกถึงความคิดสร้างสรรค์ไหม?'},
  {id:'S1',t:'S',q:'เราชอบอยู่กับคน ชอบพูดคุย และรู้สึกมีพลังเวลาได้ช่วยเหลือหรือทำงานกับคนอื่นไหม?'},
  {id:'S2',t:'S',q:'เพื่อนหรือคนรู้จักมักมาขอคำปรึกษา และเราก็ชอบฟังและช่วยแก้ปัญหาให้คนอื่นไหม?'},
  {id:'S3',t:'S',q:'อยากทำงานที่ได้ดูแลช่วยเหลือคนอื่น เช่น ครู พยาบาล นักจิตวิทยา หรือนักสังคมสงเคราะห์ไหม?'},
  {id:'E1',t:'E',q:'เราชอบเป็นคนนำ ชอบชักชวนคนอื่น และรู้สึกสนุกเวลาได้โน้มน้าวหรือพรีเซนต์ต่อหน้าคนไหม?'},
  {id:'E2',t:'E',q:'มั่นใจในตัวเอง กล้าตัดสินใจ และชอบสภาพแวดล้อมที่ต้องแข่งขันหรือท้าทายไหม?'},
  {id:'E3',t:'E',q:'ฝันอยากทำธุรกิจ บริหารองค์กร หรือเป็นผู้นำในสายงานที่ตัวเองสนใจไหม?'},
  {id:'C1',t:'C',q:'เราเป็นคนชอบจัดระเบียบ วางแผนล่วงหน้า และทำงานตามขั้นตอนที่วางไว้ชัดเจนไหม?'},
  {id:'C2',t:'C',q:'ละเอียดรอบคอบ ชอบตรวจทาน และรู้สึกสบายใจมากกว่าเวลาทำงานที่มีกฎและแบบแผนชัดเจนไหม?'},
  {id:'C3',t:'C',q:'สนใจงานด้านบัญชี การเงิน สถิติ หรืองานที่ต้องจัดการข้อมูลอย่างเป็นระบบไหม?'},
];
const RL={R:'Realistic',I:'Investigative',A:'Artistic',S:'Social',E:'Enterprising',C:'Conventional'};
const RT={R:'ช่างฝีมือ',I:'นักวิจัย',A:'ศิลปิน',S:'นักสังคม',E:'ผู้นำ',C:'นักจัดการ'};
const RC={R:'#16a34a',I:'#2563eb',A:'#7c3aed',S:'#0891b2',E:'#d97706',C:'#9333ea'};

function calcR(sc){
  var t={R:0,I:0,A:0,S:0,E:0,C:0};
  RQ.forEach(function(q){t[q.t]+=(sc[q.id]||0);});
  return Object.entries(t).sort(function(a,b){return b[1]-a[1];});
}

/* ── Counter ── */
function Counter({target}){
  var [v,setV]=useState(0);
  useEffect(function(){
    var c=0,s=target/50,t=setInterval(function(){c=Math.min(c+s,target);setV(Math.round(c));if(c>=target)clearInterval(t);},18);
    return function(){clearInterval(t);};
  },[target]);
  return React.createElement('span',{className:'match-num'},v+'%');
}

  function submit(){
    var subj=Array.from(d.subj);if(d.sO)subj.push(d.sO);
    var act=Array.from(d.act);if(d.aO)act.push(d.aO);
    var gpa=parseFloat(d.gpa).toFixed(2);
    var rs=calcR(d.ri);
    var riasecCode=rs.slice(0,3).map(function(e){return e[0];}).join('');
    var riasecDesc=riasecCode.split('').map(function(c){return RL[c];}).join(', ');

    const prompt=`คุณคือที่ปรึกษาการศึกษาไทยที่เชี่ยวชาญด้านการแนะแนวโดยใช้ Holland RIASEC Theory
ตอบภาษาไทยเท่านั้น ห้ามใช้ตัวอักษรจีนหรือญี่ปุ่นเด็ดขาด

ข้อมูลนักเรียน:
- Holland RIASEC Code: ${riasecCode} (${riasecDesc})
- ชั้นเรียน: ${data.grade} แผน${data.plan} GPA ${gpa}
- วิชาที่ชอบ: ${subj.join(', ')}
- กิจกรรม: ${act.join(', ')}
- ความฝัน: ${data.dream}

คณะในมหาวิทยาลัยไทยที่ควรพิจารณาแยกตาม RIASEC:
R (Realistic): วิศวกรรมศาสตร์ สถาปัตยกรรมศาสตร์ เกษตรศาสตร์ วนศาสตร์ เทคโนโลยีการเกษตร ประมง สัตวแพทยศาสตร์
I (Investigative): แพทยศาสตร์ ทันตแพทยศาสตร์ เภสัชศาสตร์ วิทยาศาสตร์ วิทยาการคอมพิวเตอร์ เทคนิคการแพทย์ พยาธิวิทยาคลินิก กายภาพบำบัด วิทยาศาสตร์การกีฬา
A (Artistic): นิเทศศาสตร์ วารสารศาสตร์ ศิลปกรรมศาสตร์ ดนตรี นาฏศิลป์ ภาพยนตร์ ออกแบบนิเทศศิลป์ สถาปัตยกรรมภายใน
S (Social): ครุศาสตร์ ศึกษาศาสตร์ พยาบาลศาสตร์ สังคมสงเคราะห์ จิตวิทยา สาธารณสุขศาสตร์ รัฐประศาสนศาสตร์ พัฒนาสังคม
E (Enterprising): บริหารธุรกิจ การตลาด นิติศาสตร์ รัฐศาสตร์ เศรษฐศาสตร์ การจัดการ การท่องเที่ยวและการโรงแรม
C (Conventional): บัญชี การเงิน สถิติ คณิตศาสตร์ วิทยาศาสตร์ข้อมูล ระบบสารสนเทศ

เลือกคณะที่ตรงกับ RIASEC Code ของนักเรียน ห้ามแนะนำวิศวกรรมศาสตร์ถ้า Holland Code ไม่มี R หรือ I

ตอบ JSON เท่านั้น ไม่มีข้อความอื่น ไม่มี newline ใน string:
{"summary":"สรุปบุคลิกภาพตาม Holland RIASEC 2-3 ประโยค","riasecCode":"${riasecCode}","riasecDesc":"${riasecDesc}","faculties":[{"rank":1,"name":"คณะที่เหมาะสม","match":90,"reason":"เหตุผลที่สอดคล้องกับ RIASEC Code","careers":["อาชีพ1","อาชีพ2","อาชีพ3"],"universities":[{"name":"มหาวิทยาลัย","program":"ชื่อสาขาจริง","note":"จุดเด่น"},{"name":"มหาวิทยาลัย","program":"ชื่อสาขาจริง","note":"จุดเด่น"},{"name":"มหาวิทยาลัย","program":"ชื่อสาขาจริง","note":"จุดเด่น"}]},{"rank":2,"name":"คณะที่สอง","match":80,"reason":"เหตุผล","careers":["x","x","x"],"universities":[{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"}]},{"rank":3,"name":"คณะที่สาม","match":70,"reason":"เหตุผล","careers":["x","x","x"],"universities":[{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"},{"name":"x","program":"x","note":"x"}]}],"roadmap":[{"phase":"ม.ปลาย (ตอนนี้)","title":"สร้างพื้นฐานให้แข็งแกร่ง","items":["วิชาที่ต้องเน้นและเกรดที่ควรรักษา","กิจกรรมหรือทักษะที่ควรเริ่มพัฒนา","การอ่านหนังสือหรือ resource ที่แนะนำ"]},{"phase":"ก่อน TCAS (ม.6 เทอม 1-2)","title":"เตรียมสอบและสมัคร","items":["วิชาสอบที่ต้องโฟกัส เช่น TPAT TGAT A-Level","เกณฑ์คะแนนขั้นต่ำของคณะเป้าหมาย","Portfolio หรือกิจกรรมที่ควรสะสม"]},{"phase":"หลัง TCAS (ก่อนเข้ามหาวิทยาลัย)","title":"เตรียมตัวก่อนเรียน","items":["ทักษะที่ควรฝึกก่อนเข้าเรียน","หนังสือหรือคอร์สที่ควรศึกษาล่วงหน้า","กิจกรรมที่จะช่วยให้ปรับตัวได้ดี"]}],"tip":"คำแนะนำพิเศษเฉพาะบุคคลจาก RIASEC Code ของนักเรียน"}`;

    setLoading(true);
    var B='`';
    function clean(t){
      t=t.split(B+B+B+'json').join('').split(B+B+B).join('').trim();
      var s=t.indexOf('{'),e=t.lastIndexOf('}');
      if(s>-1&&e>-1)t=t.substring(s,e+1);
      var out='';for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);if(c===10||c===13||c===9){out+=' ';}else if(c>=32&&c!==127){out+=t[i];}}
      return out.replace(/,[ ]*}/g,'}').replace(/,[ ]*]/g,']');
    }
    function api(msgs){
      return fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GK},
        body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:msgs,max_tokens:2500,temperature:0.3})
      }).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error?j.error.message:'Error '+r.status);return j.choices[0].message.content;});});
    }
    api([{role:'user',content:prompt}])
    .then(function(txt){
      var r;try{r=JSON.parse(clean(txt));}
      catch(e){return api([{role:'user',content:prompt},{role:'assistant',content:txt},{role:'user',content:'JSON มี syntax error ตอบ JSON ใหม่ ห้ามมี newline ใน string'}]).then(function(t2){return JSON.parse(clean(t2));});}
      return r;
    })
    .then(function(result){
      try{fetch(SH,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:d.name,classroom:d.room,studentNo:d.num,subjects:subj.join(', '),activities:act.join(', '),gpa:gpa,grade:d.grade,plan:d.plan,dream:d.dream,riasec:riasecCode,faculty1:result.faculties[0]?result.faculties[0].name:'',faculty2:result.faculties[1]?result.faculties[1].name:'',faculty3:result.faculties[2]?result.faculties[2].name:''})});}catch(e){}
      result._ri=d.ri;onDone(result);
    })
    .catch(function(err){alert('เกิดข้อผิดพลาด: '+err.message);})
    .finally(function(){setLoading(false);});
  }

  var EM=['😐','🙂','😊','😄','🔥'];

  return(
    <div style={{background:'var(--bg)',minHeight:'100vh'}}>
      {loading&&<Loading/>}
      <Bg/>
      <div style={{paddingTop:52}}>
        <Prog step={step} total={5}/>
        <div style={wrap}>
          <div style={{paddingTop:24,animation:'fu .3s ease'}}>

            {/* Step 1 */}
            {step===1&&(
              <div>
                <span className="eye">ขั้นที่ 1 — ข้อมูลส่วนตัว</span>
                <h2 style={h2}>เริ่มต้นด้วยการรู้จักคุณ</h2>
                <p style={sub}>กรอกข้อมูลพื้นฐานเพื่อปรับผลลัพธ์ให้เหมาะกับคุณ</p>
                <div style={fd}><label className="lbl">ชื่อ-นามสกุล</label><input className="inp" value={d.name} onChange={function(e){upd({name:e.target.value});}} placeholder="เช่น นายสมชาย ใจดี"/></div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}} className="two">
                  <div><label className="lbl">ห้องเรียน</label><input className="inp" value={d.room} onChange={function(e){upd({room:e.target.value});}} placeholder="เช่น ม.6/2"/></div>
                  <div><label className="lbl">เลขที่</label><input className="inp" value={d.num} onChange={function(e){upd({num:e.target.value});}} placeholder="เช่น 15"/></div>
                </div>
                <div style={fd}><label className="lbl">ชั้นเรียน</label>
                  <select className="sel" value={d.grade} onChange={function(e){upd({grade:e.target.value});}}>
                    <option value="">— เลือก —</option>
                    {['ม.4','ม.5','ม.6','จบ ม.6 แล้ว'].map(function(g){return <option key={g}>{g}</option>;})}
                  </select>
                </div>
                <div style={fd}><label className="lbl">แผนการเรียน</label>
                  <select className="sel" value={d.plan} onChange={function(e){upd({plan:e.target.value});}}>
                    <option value="">— เลือก —</option>
                    {['วิทย์-คณิต','ศิลป์-คำนวณ','ศิลป์-ภาษา','ศิลป์-สังคม','อื่นๆ'].map(function(p){return <option key={p}>{p}</option>;})}
                  </select>
                </div>
                <div style={fd}>
                  <label className="lbl">เกรดเฉลี่ย (GPA)</label>
                  <div style={{textAlign:'center',fontSize:52,fontWeight:800,color:'var(--g)',fontFamily:'Sarabun,sans-serif',marginBottom:8,textShadow:'0 0 24px rgba(212,175,80,.25)'}}>{parseFloat(d.gpa).toFixed(2)}</div>
                  <input type="range" min={1} max={4} step={0.05} value={d.gpa} onChange={function(e){upd({gpa:e.target.value});}}/>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--t4)',marginTop:4}}><span>1.00</span><span>2.00</span><span>3.00</span><span>4.00</span></div>
                </div>
                <button className="btn btn-p" onClick={function(){go(2);}} style={{width:'100%'}}>ถัดไป →</button>
              </div>
            )}

            {/* Step 2 */}
            {step===2&&(
              <div>
                <span className="eye">ขั้นที่ 2 — วิชาและกิจกรรม</span>
                <h2 style={h2}>คุณชอบอะไร?</h2>
                <p style={sub}>แตะเลือกได้หลายอย่าง ยิ่งตรงความจริง ผลยิ่งแม่น</p>
                <div style={fd}><label className="lbl">วิชาที่ชอบ</label>
                  <div style={cg}>{SUBJ.map(function(s){return <Chip key={s} label={s} on={d.subj.has(s)} toggle={function(){tog('subj',s);}}/>;})}</div>
                  <input className="inp" value={d.sO} onChange={function(e){upd({sO:e.target.value});}} placeholder="วิชาอื่นๆ (ถ้ามี)..."/>
                </div>
                <div style={fd}><label className="lbl">กิจกรรมที่ชอบ</label>
                  <div style={cg}>{ACTS.map(function(a){return <Chip key={a} label={a} on={d.act.has(a)} toggle={function(){tog('act',a);}}/>;})}</div>
                  <input className="inp" style={{marginTop:6}} value={d.aO} onChange={function(e){upd({aO:e.target.value});}} placeholder="กิจกรรมอื่นๆ (ถ้ามี)..."/>
                </div>
                <div style={row}><button className="btn btn-o" onClick={function(){go(1);}}>← กลับ</button><button className="btn btn-p" onClick={function(){go(3);}} style={{flex:1}}>ถัดไป →</button></div>
              </div>
            )}

            {/* Step 3 */}
            {step===3&&(
              <div>
                <span className="eye">ขั้นที่ 3 — Holland RIASEC (R, I, A)</span>
                <h2 style={h2}>ลองตอบตรงๆ นะ 😊</h2>
                <p style={sub}>ไม่มีผิดถูก ตอบตามที่รู้สึกจริงๆ เลย</p>
                <div className="gc-gold" style={{padding:'12px 16px',marginBottom:18}}>
                  <p style={{fontSize:11,color:'rgba(212,175,80,.85)',fontWeight:600,marginBottom:3}}>🎯 Holland RIASEC Theory (Holland, 1959)</p>
                  <p style={{fontSize:11,color:'var(--t3)',lineHeight:1.6}}>ทฤษฎีมาตรฐานสากลที่วัดบุคลิกภาพ 6 ด้านเพื่อจับคู่กับคณะที่เหมาะสมที่สุด</p>
                </div>
                {RQ.slice(0,9).map(function(q){
                  var val=d.ri[q.id]||0;
                  return(
                    <div key={q.id} className={'qc'+(val>0?' a':'')}>
                      <p className="qc-q">{q.q}</p>
                      <div className="qc-scale">
                        {EM.map(function(em,i){return(
                          <div key={i} className="qc-opt" onClick={function(){var o={};o[q.id]=i;upd({ri:Object.assign({},d.ri,o)});}}>
                            <div className={'qc-btn'+(val===i?' s':'')}>{val===i?em:''}</div>
                            <span className="qc-lbl">{['ไม่เลย','น้อย','ปานกลาง','มาก','มากที่สุด'][i]}</span>
                          </div>
                        );})}
                      </div>
                    </div>
                  );
                })}
                <div style={row}><button className="btn btn-o" onClick={function(){go(2);}}>← กลับ</button><button className="btn btn-p" onClick={function(){go(4);}} style={{flex:1}}>ถัดไป →</button></div>
              </div>
            )}

            {/* Step 4 */}
            {step===4&&(
              <div>
                <span className="eye">ขั้นที่ 4 — Holland RIASEC (S, E, C)</span>
                <h2 style={h2}>เกือบแล้ว! 💪</h2>
                <p style={sub}>อีกนิดเดียว แล้วจะได้รู้ว่าคุณเหมาะกับอะไร</p>
                {RQ.slice(9).map(function(q){
                  var val=d.ri[q.id]||0;
                  return(
                    <div key={q.id} className={'qc'+(val>0?' a':'')}>
                      <p className="qc-q">{q.q}</p>
                      <div className="qc-scale">
                        {EM.map(function(em,i){return(
                          <div key={i} className="qc-opt" onClick={function(){var o={};o[q.id]=i;upd({ri:Object.assign({},d.ri,o)});}}>
                            <div className={'qc-btn'+(val===i?' s':'')}>{val===i?em:''}</div>
                            <span className="qc-lbl">{['ไม่เลย','น้อย','ปานกลาง','มาก','มากที่สุด'][i]}</span>
                          </div>
                        );})}
                      </div>
                    </div>
                  );
                })}
                <div style={{marginBottom:16,marginTop:16}}><label className="lbl">ความฝัน / อยากทำอะไรในอนาคต?</label>
                  <textarea className="ta" value={d.dream} onChange={function(e){upd({dream:e.target.value});}} placeholder="เล่าให้ฟังได้เลย เช่น อยากสร้างแอป อยากเป็นหมอ อยากออกแบบ..."/>
                </div>
                <div style={row}><button className="btn btn-o" onClick={function(){go(3);}}>← กลับ</button><button className="btn btn-p" onClick={function(){go(5);}} style={{flex:1}}>ถัดไป →</button></div>
              </div>
            )}

            {/* Step 5 */}
            {step===5&&(
              <div>
                <span className="eye">ขั้นที่ 5 — ยืนยันข้อมูล</span>
                <h2 style={h2}>พร้อมแล้ว! 🚀</h2>
                <p style={sub}>ตรวจสอบข้อมูลก่อนส่งให้ AI วิเคราะห์</p>
                {(function(){
                  var subj=Array.from(d.subj);if(d.sO)subj.push(d.sO);
                  var act=Array.from(d.act);if(d.aO)act.push(d.aO);
                  var rc=calcR(d.ri).slice(0,3).map(function(e){return e[0];}).join('');
                  var rows=[['ชื่อ',d.name||'-'],['ห้อง/เลขที่',(d.room||'-')+' เลขที่ '+(d.num||'-')],['GPA',parseFloat(d.gpa).toFixed(2)],['ชั้นเรียน',d.grade+' ('+d.plan+')'],['วิชา',subj.join(', ')||'-'],['กิจกรรม',act.join(', ')||'-'],['Holland Code',rc||'-'],['ความฝัน',d.dream||'-']];
                  return(
                    <div>
                      <div className="gc" style={{padding:'18px 20px',marginBottom:12}}>
                        {rows.map(function(r){return(<div key={r[0]} className="sr-row"><span className="sr-k">{r[0]}</span><span className="sr-v">{r[1]}</span></div>);})}
                      </div>
                      <div className="gc-gold" style={{padding:'12px 16px',marginBottom:18}}>
                        <p style={{fontSize:12,color:'rgba(212,175,80,.85)',margin:0}}>🧠 AI จะวิเคราะห์โดยอ้างอิง Holland RIASEC Theory แนะนำคณะที่เหมาะกับ <strong style={{color:'var(--g)'}}>{rc}</strong></p>
                      </div>
                    </div>
                  );
                })()}
                <div style={row}>
                  <button className="btn btn-o" onClick={function(){go(4);}}>← กลับ</button>
                  <button className="btn btn-p" onClick={submit} style={{flex:1,animation:'glow 2s ease infinite'}}>🚀 วิเคราะห์เลย!</button>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── RESULT ── */
function Result({result,onRedo,onHome}){
  var [open,setOpen]=useState(0);
  var facs=result.faculties||[],road=result.roadmap||[],sc=result._ri||{};
  var rBg=['linear-gradient(135deg,#d97706,#f59e0b)','linear-gradient(135deg,#52525b,#71717a)','linear-gradient(135deg,#92400e,#b45309)'];
  var rTc=['#1c1917','#fff','#fff'];
  return(
    <div style={{background:'var(--bg)',minHeight:'100vh'}}>
      <Bg/>
      <div style={{position:'relative',zIndex:1,maxWidth:820,margin:'0 auto',padding:'72px 20px 80px'}}>

        {/* Hero */}
        <div style={{textAlign:'center',paddingBottom:48,animation:'fu .5s ease'}}>
          <span className="eye" style={{display:'block',textAlign:'center'}}>ผลการวิเคราะห์ Holland RIASEC + AI</span>
          {result.riasecCode&&(
            <div style={{display:'inline-flex',alignItems:'center',gap:14,padding:'12px 22px',borderRadius:14,border:'0.5px solid rgba(212,175,80,.18)',background:'rgba(212,175,80,.04)',margin:'8px 0 20px'}}>
              <div>
                <div style={{fontSize:9,color:'rgba(212,175,80,.4)',letterSpacing:3,textTransform:'uppercase',marginBottom:2}}>Holland Code</div>
                <div style={{fontSize:28,fontWeight:900,color:'var(--g)',letterSpacing:7,fontFamily:'Sarabun,sans-serif',textShadow:'0 0 16px rgba(212,175,80,.25)'}}>{result.riasecCode}</div>
              </div>
              <div style={{width:1,height:30,background:'rgba(212,175,80,.15)'}}/>
              <div style={{textAlign:'left'}}>
                {result.riasecCode.split('').map(function(c,i){return(
                  <div key={i} style={{fontSize:11,color:'var(--t3)'}}><span style={{color:RC[c]||'#fff',fontWeight:600}}>{c}</span> = {RL[c]}</div>
                );})}
              </div>
            </div>
          )}
          <h1 style={{fontSize:'clamp(20px,5vw,36px)',fontWeight:800,color:'var(--t1)',lineHeight:1.2,marginBottom:20}}>
            คณะที่ใช่ของคุณคือ<br/>
            <span style={{background:'linear-gradient(135deg,var(--g),var(--g2))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>
              {facs[0]?facs[0].name:'คณะที่เหมาะกับคุณ'}
            </span>
          </h1>
          <div className="gc" style={{maxWidth:600,margin:'0 auto',padding:'16px 20px',fontSize:14,color:'var(--t3)',lineHeight:1.85,textAlign:'left'}}>
            {result.summary}
          </div>
        </div>

        {/* RIASEC Chart */}
        {Object.keys(sc).length>0&&<RChart sc={sc}/>}

        {/* Faculties */}
        <div style={{marginBottom:48}}>
          <div className="sh"><div className="sh-ico">🎓</div><h2 className="sh-t">คณะที่แนะนำตาม Holland Code</h2></div>
          {facs.map(function(f,i){
            var isO=open===i;
            return(
              <div key={i} className={'fc'+(i===0?' top':'')} style={{marginBottom:12}}>
                <div className="fc-head" onClick={function(){setOpen(isO?-1:i);}}>
                  <div className="fc-rank" style={{background:rBg[i]||'rgba(124,58,237,.4)',color:rTc[i]||'#fff'}}>{i+1}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:15,fontWeight:700,color:'var(--t1)',marginBottom:6}}>{f.name}</div>
                    <div style={{display:'flex',alignItems:'center',gap:7}}>
                      <div className="match-bar"><div className="match-fill" style={{width:(f.match||0)+'%'}}/></div>
                      <span style={{fontSize:10,color:'rgba(212,175,80,.5)',flexShrink:0}}>{f.match}%</span>
                    </div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    {isO?<Counter target={f.match||0}/>:<span className="match-num">{f.match||0}%</span>}
                    <div style={{fontSize:9,color:'rgba(212,175,80,.3)',letterSpacing:2,marginTop:1}}>MATCH</div>
                  </div>
                  <span style={{color:'var(--t4)',fontSize:12,transform:isO?'rotate(180deg)':'none',transition:'transform .2s',flexShrink:0,marginLeft:4}}>▾</span>
                </div>
                {isO&&(
                  <div className="fc-body" style={{animation:'fi .22s ease'}}>
                    <p style={{fontSize:13,color:'var(--t3)',lineHeight:1.85,padding:'14px 0 16px'}}>{f.reason}</p>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:18}}>
                      {(f.careers||[]).map(function(c){return <span key={c} className="ctag">💼 {c}</span>;})}
                    </div>
                    <p style={{fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'rgba(212,175,80,.32)',marginBottom:10}}>มหาวิทยาลัยที่เปิดสอน</p>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:7}}>
                      {(f.universities||[]).map(function(u,j){return(
                        <div key={j} className="uc">
                          <div style={{display:'flex',gap:9,alignItems:'flex-start'}}>
                            <div style={{width:5,height:5,borderRadius:'50%',background:'linear-gradient(135deg,var(--pm),var(--g))',flexShrink:0,marginTop:5}}/>
                            <div>
                              <div style={{fontSize:12,fontWeight:600,color:'var(--t2)'}}>{u.name}</div>
                              <div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>{u.program}</div>
                              {u.note&&<div style={{fontSize:10,color:'rgba(212,175,80,.32)',marginTop:2}}>{u.note}</div>}
                            </div>
                          </div>
                        </div>
                      );})}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Roadmap */}
        <div style={{marginBottom:48}}>
          <div className="sh"><div className="sh-ico">🗺️</div><h2 className="sh-t">Roadmap การเตรียมตัว</h2></div>
          {road.map(function(p,i){return(
            <div key={i} style={{display:'flex',gap:14,paddingBottom:i<road.length-1?26:0,animation:'sr .4s '+(i*.1)+'s ease both'}}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',flexShrink:0,width:14}}>
                <div className="tl-dot"/>
                {i<road.length-1&&<div className="tl-line" style={{minHeight:66}}/>}
              </div>
              <div style={{flex:1}}>
                <span style={{fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'rgba(212,175,80,.55)',display:'block',marginBottom:3}}>{p.phase}</span>
                <div style={{fontSize:15,fontWeight:600,color:'var(--t1)',marginBottom:9}}>{p.title}</div>
                <div className="gc" style={{padding:'12px 14px'}}>
                  {(p.items||[]).map(function(it,j){return(
                    <div key={j} style={{display:'flex',gap:7,fontSize:13,color:'var(--t3)',lineHeight:1.65,marginBottom:j<p.items.length-1?6:0}}>
                      <span style={{color:'rgba(212,175,80,.35)',flexShrink:0}}>›</span>{it}
                    </div>
                  );})}
                </div>
              </div>
            </div>
          );})}
        </div>

        {result.tip&&(
          <div style={{display:'flex',gap:12,padding:'18px 20px',borderRadius:14,border:'0.5px solid rgba(212,175,80,.14)',background:'rgba(212,175,80,.03)',marginBottom:44}}>
            <span style={{fontSize:20,flexShrink:0}}>🌟</span>
            <p style={{fontSize:13,color:'rgba(212,175,80,.75)',lineHeight:1.85,margin:0}}>{result.tip}</p>
          </div>
        )}

        <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
          <button className="btn btn-p" onClick={function(){window.print();}} style={{padding:'11px 24px',fontSize:14}}>🖨️ พิมพ์ผลลัพธ์</button>
          <button className="btn btn-o" onClick={onRedo}>ทำแบบประเมินใหม่</button>
          <button className="btn btn-o" onClick={onHome}>หน้าหลัก</button>
        </div>
      </div>
    </div>
  );
}

/* ── APP ── */
function App(){
  var [screen,setScreen]=useState('home');
  var [result,setResult]=useState(null);
  var [step,setStep]=useState(1);
  var [total,setTotal]=useState(5);
  return(
    <div>
      <Nav
        screen={screen}
        step={step}
        total={total}
        onHome={function(){setScreen('home');}}
        onRedo={function(){setScreen('form');setStep(1);}}
      />
      {screen==='home'&&<Home onStart={function(){setScreen('form');}}/>}
      {screen==='form'&&<Form
        onDone={function(r){setResult(r);setScreen('result');}}
        onHome={function(){setScreen('home');}}
        setStep={setStep}
        setTotal={setTotal}
      />}
      {screen==='result'&&<Result
        result={result}
        onRedo={function(){setScreen('form');setStep(1);}}
        onHome={function(){setScreen('home');}}
      />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
